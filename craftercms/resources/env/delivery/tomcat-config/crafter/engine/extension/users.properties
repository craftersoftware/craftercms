# Spring Security user format:
# username=password[,enabled|disabled],ROLE_A,ROLE_B
#
# WARNING: Changing the admin password here will affect your ability to log in to the system as an administrator.
# Make sure to securely store any new password and update documentation as necessary.
#
# To use an encrypted password instead of plain text, you must prefix the password with the PasswordEncoder ID.
# For example, to use a noop (plain text) encoder:
#   admin={noop}admin,ROLE_ADMIN
#
# To use an encrypted (hashed) password, use the appropriate encoder and hash.
# Example with bcrypt:
#   admin={bcrypt}$2a$10$E...hashedpassword...,ROLE_ADMIN
#
# You can generate a bcrypt hash with tools like:
#   $ echo -n "yourpassword" | bcrypt
#   or
#   $ openssl passwd -6 "yourpassword"
# Replace {bcrypt} and the hash accordingly.
#
# Example:
#admin={noop}admin,ROLE_TEST1,ROLE_TEST2
