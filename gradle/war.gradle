/*
 * Shared configuration for CrafterCMS WAR modules.
 */

import org.apache.tools.ant.filters.ReplaceTokens

apply from: "${rootDir}/gradle/build-metadata.gradle"

def buildMetadata = crafterBuildMetadata

plugins.withId('war') {
	war {
		manifest {
			attributes(crafterManifestAttributes())
		}
	}

	tasks.register('classesJar', Jar) {
		archiveClassifier = 'classes'
		from sourceSets.main.output
		manifest {
			attributes(crafterManifestAttributes())
		}
	}

	configurations {
		classes {
			canBeConsumed = true
			canBeResolved = false
		}
	}

	artifacts {
		add('archives', tasks.named('classesJar'))
		add('classes', tasks.named('classesJar'))
	}
}


ext.configureFilteredWarResource = { warTask, sourceDir, targetPath ->
	warTask.from(sourceDir) {
		into targetPath
		filter(ReplaceTokens, tokens: [
			buildNumber: buildMetadata.buildNumber,
			timestamp  : buildMetadata.timestamp
		])
	}
}
