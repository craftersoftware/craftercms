/*
 * Publishes module artifacts to the local Maven repository (~/.m2/repository).
 * Run: ./gradlew publishToMavenLocal
 */

def configureMavenPublishing = {
	if (plugins.hasPlugin('maven-publish')) {
		return
	}
	apply plugin: 'maven-publish'

	publishing {
		repositories {
			mavenLocal()
		}
	}

	afterEvaluate {
		if (publishing.publications.findByName('maven')) {
			return
		}

		publishing {
			publications {
				register('maven', MavenPublication) {
					groupId = project.group.toString()
					artifactId = project.base.archivesName.get()
					version = project.version.toString()

					if (plugins.hasPlugin('war')) {
						from components.web
						artifact(tasks.named('classesJar'))
					} else if (plugins.hasPlugin('org.springframework.boot')) {
						artifact(tasks.named('bootJar'))
					} else {
						from components.java
					}
				}
			}
		}
	}
}

if (plugins.hasPlugin('java')) {
	configureMavenPublishing()
} else {
	pluginManager.withPlugin('java') {
		configureMavenPublishing()
	}
}
