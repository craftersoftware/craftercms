/*
 * Maven publishing for module artifacts.
 *
 * Local:  ./gradlew publishToMavenLocal
 * GitHub: ./gradlew publishMavenPublicationToGitHubPackagesRepository
 *         (requires GITHUB_ACTOR + GITHUB_TOKEN, or -Pgpr.user= / -Pgpr.key=)
 *
 * Repository defaults to https://maven.pkg.github.com/craftercms/craftercms
 * Override with -Pgpr.owner= / -Pgpr.repo=
 */

def configureMavenPublishing = {
	if (plugins.hasPlugin('maven-publish')) {
		return
	}
	apply plugin: 'maven-publish'

	def gprUser = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
	def gprKey = System.getenv('GITHUB_TOKEN') ?: System.getenv('GPR_TOKEN') ?: findProperty('gpr.key')
	def gprOwner = findProperty('gpr.owner') ?: 'craftersoftware'
	def gprRepo = findProperty('gpr.repo') ?: 'craftercms'

	publishing {
		repositories {
			mavenLocal()
			if (gprUser && gprKey) {
				maven {
					name = 'GitHubPackages'
					url = uri("https://maven.pkg.github.com/${gprOwner}/${gprRepo}")
					credentials {
						username = gprUser.toString()
						password = gprKey.toString()
					}
				}
			}
		}
	}

	afterEvaluate {
		if (publishing.publications.findByName('maven')) {
			return
		}

		publishing {
			publications {
				register('maven', MavenPublication) {
					groupId = project.group.toString()
					artifactId = project.base.archivesName.get()
					version = project.version.toString()

					if (plugins.hasPlugin('war')) {
						from components.web
						artifact(tasks.named('classesJar'))
					} else if (plugins.hasPlugin('org.springframework.boot')) {
						artifact(tasks.named('bootJar'))
					} else {
						from components.java
					}
				}
			}
		}
	}
}

if (plugins.hasPlugin('java')) {
	configureMavenPublishing()
} else {
	pluginManager.withPlugin('java') {
		configureMavenPublishing()
	}
}
