/*
 * CycloneDX BOM generation for Java/Groovy modules.
 * Matches the former parent POM cyclonedx-maven-plugin configuration (makeBom goal).
 */

apply plugin: 'org.cyclonedx.bom'

cyclonedxBom {
	projectType = 'application'
	schemaVersion = '1.4'
	includeBomSerialNumber = true
	includeLicenseText = false
	outputFormat = 'json'
	outputName = 'bom'
	destination = layout.buildDirectory.get().asFile
	skipConfigs = ['testRuntimeClasspath']
}

tasks.register('bomGenerate') {
	group = 'build'
	description = 'Generates CycloneDX BOM'
	dependsOn tasks.named('cyclonedxBom')
}
