/*
 * Shared build metadata for manifest attributes and resource token replacement.
 * Matches Maven buildnumber-maven-plugin behavior:
 *   - buildNumber: SCM revision (git commit), or 'unknown' if unavailable
 *   - timestamp: epoch milliseconds for the Build-On manifest attribute
 *   - crafterManifestTitle: human-friendly Implementation-Title, set in each module's build.gradle
 */

def resolveScmBuildNumber = {
	if (findProperty('buildNumber')) {
		return findProperty('buildNumber').toString()
	}
	def proc = ['git', 'rev-parse', 'HEAD'].execute(null, rootDir)
	proc.waitFor()
	return proc.exitValue() == 0 ? proc.text.trim() : 'unknown'
}

def resolveBuildTimestamp = {
	if (findProperty('timestamp')) {
		return findProperty('timestamp').toString()
	}
	return System.currentTimeMillis().toString()
}

ext.crafterBuildMetadata = [
	buildNumber: resolveScmBuildNumber(),
	timestamp  : resolveBuildTimestamp()
]

ext.crafterManifestAttributes = {
	def jdkVersion = findProperty('javaVersion').toString()
	def title = findProperty('crafterManifestTitle')?.toString()
	if (!title) {
		throw new GradleException("Set ext.crafterManifestTitle in ${project.path}/build.gradle")
	}

	[
		'Implementation-Title'   : title,
		'Implementation-Version' : version.toString(),
		'Implementation-Vendor'  : 'CrafterCMS',
		'Implementation-Build'   : crafterBuildMetadata.buildNumber,
		'Build-On'               : crafterBuildMetadata.timestamp,
		'Java-Version'           : jdkVersion,
		'Build-Jdk-Spec'         : jdkVersion
	]
}
