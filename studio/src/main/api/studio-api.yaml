                freeSpace: 83483381760
                usedSpace: 417125715968
                freeSpaceDisplaySize: "77 GB"
                totalSpaceDisplaySize: "466 GB"
                usedSpaceDisplaySize: "388 GB"
                highWaterMark: 90
                lowWaterMark: 85
                alarm: false
                alarmDate: null
                lastCheck: "2025-08-08T23:15:00.003858610Z"
