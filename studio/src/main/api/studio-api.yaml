                          * `BIT ORDER (little-endian)`: 23, `FLAG`: RETIRED ACTION - Publish: Reject, `DESCRIPTION`: This action is no longer used
                          * `BIT ORDER (little-endian)`: 24, `FLAG`: Content: Unlock, `DESCRIPTION`: Unlock content item
                childrenCount:
