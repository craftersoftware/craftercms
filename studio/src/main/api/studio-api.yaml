    /api/2/workflow/{siteId}/item_states:
        get:
            tags:
                - workflow
            summary: Get item workflow states for site
            description: |
                    Module: Studio <br>
                    Required permission "get_item_states"
            operationId: getItemStates
            parameters:
                -   name: siteId
                    in: path
                    description: site ID
                    required: true
                    schema:
                        type: string
                -   name: path
                    in: query
                    description: path regex
                    required: false
                    schema:
                        type: string
                -   name: states
                    in: query
                    description: states bitmap mask
                    required: false
                    schema:
                        type: integer
                        format: int64
                -   name: offset
                    in: query
                    description: Offset of first record in this response
                    schema:
                        type: integer
                        format: int64
                -   name: limit
                    in: query
                    description: Number of records returned in this response
                    schema:
                        type: integer
                        format: int64
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    total:
                                        type: integer
                                        format: int32
                                        description: Total records in the system
                                    offset:
                                        type: integer
                                        format: int32
                                        description: Offset of first record in this response
                                    limit:
                                        type: integer
                                        format: int32
                                        description: Number of records returned in this response
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/ContentItem'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'

        post:
            tags:
                - workflow
            summary: Set item workflow states for site
            description: |
                    Module: Studio <br>
                    Required permission "set_item_states"
            operationId: setItemStates
            parameters:
                -   name: siteId
                    in: path
                    description: Site ID
                    required: true
                    schema:
                        type: string
            requestBody:
                description: List of items to set workflow state(s)
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                items:
                                    type: array
                                    description: path(s) of item(s)
                                    items:
                                        type: string
                                clearSystemProcessing:
                                    type: boolean
                                    description: true if system processing is to be cleared
                                clearUserLocked:
                                    type: boolean
                                    description: true if user lock is to be cleared
                                live:
                                    type: boolean
                                    description: true if item is to be set as live, otherwise false
                                staged:
                                    type: boolean
                                    description: true if item is to be set as staged, otherwise false
                                new:
                                    type: boolean
