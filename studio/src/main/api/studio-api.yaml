                    description: >-
                        bitmap of states
                          * `BIT ORDER (little-endian)`: 0, `FLAG`: READY, `DESCRIPTION`: The package is ready to be published (this is conditional on package approvalState)
                          * `BIT ORDER (little-endian)`: 1: `FLAG`: PROCESSING, `DESCRIPTION`: The package is currently being processed
                          * `BIT ORDER (little-endian)`: 2: `FLAG`: LIVE_SUCCESS, `DESCRIPTION`: The package has been published to live target
                          * `BIT ORDER (little-endian)`: 3: `FLAG`: LIVE_COMPLETED_WITH_ERRORS, `DESCRIPTION`: The package has been partially published to live target due to errors
                          * `BIT ORDER (little-endian)`: 4: `FLAG`: LIVE_FAILED, `DESCRIPTION`: The package failed to be published to live target
                          * `BIT ORDER (little-endian)`: 5: `FLAG`: STAGING_SUCCESS, `DESCRIPTION`: The package has been published to stage
                          * `BIT ORDER (little-endian)`: 6: `FLAG`: STAGING_COMPLETED_WITH_ERRORS, `DESCRIPTION`: The package has been partially published to stage target due to errors
                          * `BIT ORDER (little-endian)`: 7: `FLAG`: STAGING_FAILED, `DESCRIPTION`: The package failed to be published to stage target
                          * `BIT ORDER (little-endian)`: 8: `FLAG`: COMPLETED, `DESCRIPTION`: The package has been completed in at least one target
                          * `BIT ORDER (little-endian)`: 9: `FLAG`: CANCELLED, `DESCRIPTION`: The package has been cancelled
                    example: 1
                schedule:
                    type: string
                    format: date-time
                submitter:
                    $ref: '#/components/schemas/Person'
                reviewer:
                    $ref: '#/components/schemas/Person'
                siteId:
                    type: string
                    description: site ID
                liveError:
                    type: integer
                    description: ApiResponse code
                stagingError:
                    type: integer
                    description: ApiResponse code
                publishedOn:
                    type: string
                    format: date-time
                    description: date and time when package was published
                packageType:
                    type: string
                    description: package type
                    enum:
                        - INITIAL_PUBLISH
                        - ITEM_LIST
                        - PUBLISH_ALL
                commitId:
                    type: string
                    description: commit ID to be published
                publishedStagingCommitId:
                    type: string
                    description: commit ID published to staging
                publishedLiveCommitId:
                    type: string
                    description: commit ID published to live
                itemCount:
                    type: integer
                    description: number of items in the package
                availableActions:
                    type: integer
                    format: int64
                    description: >-
                        available actions bitmap
                          * `BIT ORDER (little-endian)`: 0, `FLAG`: Approve, `DESCRIPTION`: Approve the publish package
                          * `BIT ORDER (little-endian)`: 1, `FLAG`: Reject, `DESCRIPTION`: Reject the publish package
                          * `BIT ORDER (little-endian)`: 2, `FLAG`: Cancel, `DESCRIPTION`: Cancel the publish package
                          * `BIT ORDER (little-endian)`: 3, `FLAG`: Resubmit, `DESCRIPTION`: Recalculate and resubmit the publish package
            required:
                - id
                - siteId
                - schedule
                - approver
                - state
                - publishingTarget

        PublishItem:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                path:
                    type: string
                    description: path of the content item
                livePreviousPath:
                    type: string
                    description: previous path of the content item in live target
                stagingPreviousPath:
                    type: string
                    description: previous path of the content item in staging target
                action:
                    type: string
                    description: action to be performed on the content item
                    enum:
                        - ADD
                        - UPDATE
                        - DELETE
                userRequested:
                    type: boolean
                    description: true if user directly requested to include this item, otherwise false (if included as a calculated dependency)
                publishedState:
                    type: integer
                    description: >-
                        bitmap of states
                          * `BIT ORDER (little-endian)`: 0, `FLAG`: PENDING, `DESCRIPTION`: The item is pending to be processed
                          * `BIT ORDER (little-endian)`: 1: `FLAG`: PROCESSING, `DESCRIPTION`: The item is currently being processed
                          * `BIT ORDER (little-endian)`: 2: `FLAG`: LIVE_SUCCESS, `DESCRIPTION`: The item has been published to live target
                          * `BIT ORDER (little-endian)`: 3: `FLAG`: LIVE_FAILED, `DESCRIPTION`: The item failed to be published to live target
                          * `BIT ORDER (little-endian)`: 4: `FLAG`: STAGING_SUCCESS, `DESCRIPTION`: The item has been published to stage
                          * `BIT ORDER (little-endian)`: 5: `FLAG`: STAGING_FAILED, `DESCRIPTION`: The item failed to be published to stage target
                    example: 1
                liveError:
                    type: integer
                    description: ApiResponse code
                stagingError:
                    type: integer
                    description: ApiResponse code
                itemMetadata:
                    type: object
                    description: metadata of the content item
                    properties:
                        label:
                            type: string
                            description: content item label (internal-name)
                        systemType:
                            type: string
                            description: system type of the content item
                            enum:
                                - asset
                                - page
                                - component
                                - levelDescriptor
                                - document
                                - renderingTemplate
                                - content type
                                - file
                                - folder
                                - script
                                - taxonomy
                        mimeType:
                            type: string
                            description: mime-type of content item file

        LightItem:
            type: object
            description: calculated publish item metadata
            properties:
                path:
                    type: string
                    description: the path of the content item
                label:
                    type: string
                    description: content item label (internal-name)
                systemType:
                    type: string
                    description: one of the predefined type values (page, component, asset, levelDescriptor, folder ...)
                mimeType:
                    type: string
                    description: MIME-type of the content item file

        PublishDependency:
            type: object
            description: publish dependency object
            allOf:
                -   $ref: '#/components/schemas/LightItem'
                -   type: object
                    properties:
                        canApprove:
                            type: boolean
                            description: true if current user can approve the publish dependency, otherwise false
                        canRequestPublish:
                            type: boolean
                            description: true if current user can request publish for the publish dependency, otherwise false

        PublishTaskProgress:
            type: object
            description: publishing task progress report object
            allOf:
                -   type: object
                    properties:
                        result:
                            description: result of the publish task execution
                            type: object
                            properties:
                                success:
                                    type: boolean
                                    description: true if task was successful, otherwise false
                                message:
                                    type: string
                                    description: message of the task execution
                                result:
                                    type: integer
                                    description: final state of the publish package
                -   $ref: '#/components/schemas/AbstractTaskProgress'

        AbstractTaskProgress:
            type: object
            description: general task progress object
            properties:
                taskId:
                    type: object
                    description: task identifier
                    example:
                        siteId: "ed3"
                        packageId: 17
                type:
                    type: string
                    description: task type
                    example: publish
                startTime:
                    type: string
                    format: date-time
                    description: start time of the task execution
                endTime:
                    type: string
                    format: date-time
                    description: end time of the task execution
                state:
                    type: string
                    description: state of the task execution
                    enum:
                        - READY
                        - IN_PROGRESS
                        - COMPLETED
                result:
                    description: result of the task execution
                    type: object
                    properties:
                        success:
                            type: boolean
                            description: true if task was successful, otherwise false
                        message:
                            type: string
                            description: message of the task execution
                stages:
                    example:
                        -   name: "Repo sync"
                            state: "COMPLETED"
                            processed: 1
                            total: 1
                            errors: false
                        -   name: "Item list loading"
                            state: "COMPLETED"
                            processed: 100
                            total: 100
                            errors: false
                        -   name: "Staging publish"
                            state: "IN_PROGRESS"
                            processed: 54
                            total: 100
                            errors: false
                        -   name: "Staging Commit"
                            state: "READY"
                            processed: 0
                            total: 1
                            errors: false
                        -   name: "Live publish"
                            state: "IN_PROGRESS"
                            processed: 54
                            total: 100
                            errors: false
                        -   name: "Live Commit"
                            state: "READY"
                            processed: 0
                            total: 1
                            errors: false
                        -   name: "Package update"
                            state: "READY"
                            processed: 0
                            total: 1
                            errors: false
                    type: array
                    items:
                        type: object
                        properties:
                            name:
                                type: string
                                description: stage name
                                example: "Repo sync"
                            state:
                                type: string
                                description: stage state
                                enum: [ "READY", "IN_PROGRESS", "COMPLETED" ]
                            total:
                                type: integer
                                format: int32
                                description: total number of items in stage
                                example: 1
                            processed:
                                type: integer
                                format: int32
                                description: number of items processed
                            errors:
                                type: boolean
                                description: true if stage has errors, otherwise false

        PublishPackageRequest:
            type: object
            properties:
                publishingTarget:
                    type: string
                    description: the publishing target (staging or live)
                    example: staging
                paths:
                    type: array
                    items:
                        type: object
                        properties:
                            path:
                                type: string
                                description: the path of the item to publish
                            includeChildren:
                                type: boolean
                                description: include children of the given path
                                default: false
                            includeSoftDeps:
                                type: boolean
                                description: include soft dependencies (also includes soft dependencies of children)
                                default: false
                commitIds:
                    type: array
                    items:
                        type: string
                    description: the commit ids to publish

        UpdatePackageRequest:
            type: object
            properties:
                schedule:
                    type: string
                    format: date-time
                    description: schedule when to publish the package. Used only when updateSchedule is true
                updateSchedule:
                    type: boolean
                    description: if true, update schedule using the schedule parameter. Otherwise, keep the current schedule
                    default: false
                comment:
                    type: string
                    description: submitter comment. If omitted or null, the current comment is kept
                title:
                    type: string
                    description: package title. If omitted or null, the current title is kept
                    maxLength: 200
                requestApproval:
                    type: boolean
                    description: |
                        if true and the package is approved, set the approval state to SUBMITTED
                        (resubmit for approval). If false and the package is approved, keep APPROVED
                        (requires publish_review; not allowed when peer review is enabled)
                    default: false

        PublishingStatus:
            type: object
            properties:
                enabled:
                    type: boolean
                    description: true if publishing for site is enabled, otherwise false
                published:
                    type: boolean
                    description: true if site has been published at least once (initial publish; published repository exist), otherwise false
                currentTask:
                    $ref: '#/components/schemas/PublishTaskProgress'

        ContentItem:
            type: object
            properties:
