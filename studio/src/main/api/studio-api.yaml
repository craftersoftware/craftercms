openapi: 3.0.0
servers:
    -   url: 'http://localhost:8080/studio'
info:
    description: |-
        Crafter Studio API
    version: '5.0.0'
    title: Crafter Studio
    termsOfService: ''
    contact:
        email: info@craftercms.com
    license:
        name: GPL 3.0
        url: 'https://www.gnu.org/licenses/gpl-3.0.en.html'
externalDocs:
    description: CrafterCMS - Studio
    url: 'https://craftercms.com/docs/current/reference/modules/studio.html'
tags:
    -   name: groups
        description: Group management operations
    -   name: users
        description: User management operations
    -   name: ui
        description: UI support operations
    -   name: aws
        description: AWS operations
    -   name: cluster
        description: Cluster management operations
    -   name: sites
        description: Site management operations
    -   name: search
        description: Search operations
    -   name: audit
        description: Audit log operations
    -   name: monitoring
        description: Monitoring operations
    -   name: repository
        description: Repository operations
    -   name: content
        description: Content operations
    -   name: configuration
        description: Configuration operations
    -   name: plugin
        description: Plugin operations
    -   name: dependency
        description: Dependencies operations
    -   name: marketplace
        description: Marketplace operations
    -   name: webdav
        description: WebDAV operations
    -   name: publishing
        description: Publishing operations
    -   name: security
        description: Security operations
    -   name: dashboard
        description: Dashboard operations
    #  - name: translation
    #    description: Translation operations
    -   name: workflow
        description: Workflow operations
    #  - name: tasks
    #    description: tasks operations
    -   name: loggers
        description: Logger configuration operations
    -   name: server
        description: Server operations
    -   name: system
        description: System operations
    -   name: model
        description: Data models definitions
    -   name: contentTypes
        description: Content type operations

paths:

    /api/2/groups:
        get:
            tags:
                - groups
            summary: Get all groups
            operationId: getGroups
            description: |
                    Module: Studio <br>
                    Required Permission: "READ_GROUPS"
            parameters:
                -   name: keyword
                    in: query
                    description: The keyword to filter groups
                    required: false
                    schema:
                        type: string
                -   name: offset
                    in: query
                    description: Offset of first group in the response
                    required: false
                    schema:
                        type: integer
                        format: int32
                -   name: limit
                    in: query
                    description: Number of groups to return
                    required: false
                    schema:
                        type: integer
                        format: int32
                -   name: sort
                    in: query
                    description: |-
                        The fields to use for sorting, plus the `asc` or `desc` keyword case-insensitive. Multiple fields are separated by
                        commas. Example: `column1 ASC, column2 DESC`.
                    required: false
                    schema:
                        type: string
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    total:
                                        type: integer
                                        format: int32
                                        description: Total records in the system
                                    offset:
                                        type: integer
                                        format: int32
                                        description: Offset of first record in this response
                                    limit:
                                        type: integer
                                        format: int32
                                        description: Number of records returned in this response
                                    groups:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Group'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        post:
            tags:
                - groups
            summary: Create group
            description: |
                    Module: Studio <br>
                    Required Permission: "CREATE_GROUPS"
            operationId: createGroup
            requestBody:
                description: Group entity to create
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Group'
            responses:
                '201':
                    description: Created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    group:
                                        $ref: '#/components/schemas/Group'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        patch:
            tags:
                - groups
            summary: Update group
            description: |
                    Module: Studio <br>
                    Required Permission: "UPDATE_GROUPS"
            operationId: updateGroup
            requestBody:
                description: Group entity to update
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateGroupRequest'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    group:
                                        $ref: '#/components/schemas/Group'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        delete:
            tags:
                - groups
            summary: Delete group(s)
            description: |
                    Module: Studio <br>
                    Required Permission: "DELETE_GROUPS"
            operationId: deleteGroup
            parameters:
                -   name: id
                    in: query
                    description: The group ID(s). Can be repeated for multiple deletes (id=1&id=2&id=3)
                    required: true
                    schema:
                        type: array
                        items:
                            type: string
            responses:
                '200':
                    description: Deleted
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/groups/{id}:
        get:
            tags:
                - groups
            summary: Get group by ID
            description: |
                    Module: Studio <br>
                    Required Permission: "READ_GROUPS"
            operationId: getGroup
            parameters:
                -   name: id
                    in: path
                    description: The group ID
                    required: true
                    schema:
                        type: integer
                        format: int64
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    group:
                                        $ref: '#/components/schemas/Group'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/groups/by_name/{name}:
        get:
            tags:
                - groups
            summary: Get group by name
            description: |
                    Module: Studio <br>
                    Required Permission: "READ_GROUPS"
            operationId: getGroupByName
            parameters:
                -   name: name
                    in: path
                    description: The group name
                    required: true
                    schema:
                        type: string
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    group:
                                        $ref: '#/components/schemas/Group'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/groups/{id}/members:
        get:
            tags:
                - groups
            summary: Get all the members of the specified group
            description: |
                    Module: Studio <br>
                    Required Permission: "READ_GROUPS"
            operationId: getGroupMembers
            parameters:
                -   name: id
                    in: path
                    description: The group ID
                    required: true
                    schema:
                        type: integer
                        format: int64
                -   name: offset
                    in: query
                    description: Offset of first record in the response
                    required: false
                    schema:
                        type: integer
                        format: int32
                -   name: limit
                    in: query
                    description: Number of records to return
                    required: false
                    schema:
                        type: integer
                        format: int32
                -   name: sort
                    in: query
                    description: |-
                        The fields to use for sorting, plus the `asc` or `desc` keyword case-insensitive. Multiple fields are separated by
                        commas. Example: `column1 ASC, column2 DESC`.
                    required: false
                    schema:
                        type: string
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    total:
                                        type: integer
                                        format: int32
                                        description: Total records in the system
                                    offset:
                                        type: integer
                                        format: int32
                                        description: Offset of first record in this response
                                    limit:
                                        type: integer
                                        format: int32
                                        description: Number of records returned in this response
                                    users:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/UserResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        post:
            tags:
                - groups
            summary: Add member(s) to the specified group
            description: |
                    Module: Studio <br>
                    Required Permission: "UPDATE_GROUPS"
            operationId: addGroupMembers
            parameters:
                -   name: id
                    in: path
                    description: The group ID
                    required: true
                    schema:
                        type: integer
                        format: int64
            requestBody:
                description: List of user IDs and/or usernames to add
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                ids:
                                    type: array
                                    items:
                                        type: string
                                usernames:
                                    type: array
                                    items:
                                        type: string
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    users:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/UserResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        delete:
            tags:
                - groups
            summary: |-
                Remove member(s) from the specified group
            description: |
                    Module: Studio <br>
                    Required Permission: "DELETE_GROUPS"
            operationId: removeGroupMembers
            parameters:
                -   name: id
                    in: path
                    description: The group ID
                    required: true
                    schema:
                        type: integer
                        format: int64
                -   name: userId
                    in: query
                    description: The user ID(s) to remove. Can be repeated for multiple deletes (userId=1&userId=2&userId=3)
                    required: false
                    schema:
                        type: array
                        items:
                            type: string
                -   name: username
                    in: query
                    description: The username(s) to remove. Can be repeated for multiple deletes (username=john&username=mark)
                    required: false
                    schema:
                        type: array
                        items:
                            type: string
            responses:
                '200':
                    description: Deleted
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/users:
        get:
            tags:
                - users
            summary: Get all users
            description: |
                    Module: Studio <br>
                    Required Permission: "READ_USERS"
            operationId: getUsers
            parameters:
                -   name: site_id
                    in: query
                    description: The site ID to filter users for a particular site
                    required: false
                    schema:
                        type: string
                -   name: keyword
                    in: query
                    description: The keyword to filter users
                    required: false
                    schema:
                        type: string
                -   name: offset
                    in: query
                    description: Offset of first record in the response
                    required: false
                    schema:
                        type: integer
                        format: int32
                -   name: limit
                    in: query
                    description: Number of records to return
                    required: false
                    schema:
                        type: integer
                        format: int32
                -   name: sort
                    in: query
                    description: |-
                        The fields to use for sorting, plus the `asc` or `desc` keyword case-insensitive. Multiple fields are separated by
                        commas. Example: `column1 ASC, column2 DESC`.
                    required: false
                    schema:
                        type: string
                -   name: showDisabled
                    in: query
                    description: If true, include disabled users in the response
                    required: false
                    schema:
                        type: boolean
                        default: false
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    total:
                                        type: integer
                                        format: int32
                                        description: Total records in the system
                                    offset:
                                        type: integer
                                        format: int32
                                        description: Offset of first record in this response
                                    limit:
                                        type: integer
                                        format: int32
                                        description: Number of records returned in this response
                                    users:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/UserResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        post:
            tags:
                - users
            summary: Create user
            description: |
                    Module: Studio <br>
                    Required Permission: "CREATE_USERS"
            operationId: createUser
            requestBody:
                description: User entity to create
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequest'
            responses:
                '201':
                    description: Created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    users:
                                        $ref: '#/components/schemas/UserResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        patch:
            tags:
                - users
            summary: Update user
            description: |
                    Module: Studio <br>
                    Required Permission: "UPDATE_USERS"
            operationId: updateUser
            requestBody:
                description: User entity to update. Supported update attributes are firstName, lastName, email and enabled.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateUserRequest'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    user:
                                        $ref: '#/components/schemas/UserResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/users/{id}:
        get:
            tags:
                - users
            summary: Get user by user ID or username
            description: |
                    Module: Studio <br>
                    Required Permission: "READ_USERS"
            operationId: getUser
            parameters:
                -   name: id
                    in: path
                    description: The user ID. Username can also be used
                    required: true
                    schema:
                        type: string
            responses:
                '201':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    user:
                                        $ref: '#/components/schemas/UserResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/users/enable:
        patch:
            tags:
                - users
            summary: Enable user(s)
            description: |
                    Module: Studio <br>
                    Required Permission: "UPDATE_USERS"
            operationId: enableUser
            requestBody:
                description: List of user IDs and/or usernames to enable
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                ids:
                                    type: array
                                    items:
                                        type: string
                                usernames:
                                    type: array
                                    items:
                                        type: string
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    users:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/UserResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/users/disable:
        patch:
            tags:
                - users
            summary: Disable user(s)
            description: |
                    Module: Studio <br>
                    Required Permission: "UPDATE_USERS"
            operationId: disableUser
            requestBody:
                description: List of user IDs and/or usernames to disable
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                ids:
                                    type: array
                                    items:
                                        type: string
                                usernames:
                                    type: array
                                    items:
                                        type: string
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    users:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/UserResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/users/{id}/sites:
        get:
            tags:
                - users
            summary: Get all the sites the specified user has access to
            description: |
                    Module: Studio <br>
                    Required Permission: "READ_USERS"
            operationId: getUserSites
            parameters:
                -   name: id
                    in: path
                    description: The user ID. Username can also be used
                    required: true
                    schema:
                        type: string
                -   name: offset
                    in: query
                    description: Offset of first site in the response
                    required: false
                    schema:
                        type: integer
                        format: int32
                -   name: limit
                    in: query
                    description: Number of sites to return
                    required: false
                    schema:
                        type: integer
                        format: int32
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    total:
                                        type: integer
                                        format: int32
                                        description: Total records in the system
                                    offset:
                                        type: integer
                                        format: int32
                                        description: Offset of first record in this response
                                    limit:
                                        type: integer
                                        format: int32
                                        description: Number of records returned in this response
                                    sites:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Site'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/users/{id}/sites/{siteId}/roles:
        get:
            tags:
                - users
            summary: Get the site roles for the specified user
            description: |
                    Module: Studio <br>
                    Required Permission: "READ_USERS"
            operationId: getUserSiteRoles
            parameters:
                -   name: id
                    in: path
                    description: The user ID. Username can also be used
                    required: true
                    schema:
                        type: string
                -   name: siteId
                    in: path
                    description: The site ID
                    required: true
                    schema:
                        type: string
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    roles:
                                        type: array
                                        items:
                                            type: string
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/users/{id}/reset_password:
        post:
            tags:
                - users
            summary: Reset password for user
            description: |
                    Module: Studio <br>
                    Required Permission: "UPDATE_USERS"
            operationId: resetUserPassword
            parameters:
                -   name: id
                    in: path
                    description: The user ID. Username can also be used
                    required: true
                    schema:
                        type: string
            requestBody:
                description: request body to reset password for user
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                username:
                                    type: string
                                new:
                                    type: string
                                    description: new password
                            required:
                                - username
                                - new
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/users/set_password:
        post:
            tags:
                - users
            summary: Change password for user
            description: |
                    Module: Studio <br>
                    Required Permission: "ANONYMOUS"
            operationId: setUserPassword
            requestBody:
                description: request body to change password
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                token:
                                    type: string
                                new:
                                    type: string
                                    description: new password
                            required:
                                - token
                                - new
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    user:
                                        $ref: '#/components/schemas/UserResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/2/users/me:
        get:
            tags:
                - users
            summary: Get current authenticated user
            description: |
                    Module: Studio <br>
                    Required Permission: "LOGGED_IN"
            operationId: getCurrentUsername
