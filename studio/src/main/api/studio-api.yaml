        ContentValidationRequest:
            type: object
            properties:
                actions:
                    type: array
                    description: The list of actions to verify
                    items:
                        type: object
                        properties:
                            type:
                                type: string
                                description: >
                                    The type of action, possible values: CREATE, RENAME, MOVE, COPY
                            source:
                                type: string
                                description: The source value, only needed for recursive COPY, MOVE and RENAME actions
                            target:
                                type: string
                                description: The target value
                            recursive:
                                type: boolean
                                description: Indicates if all child items should be verified too
                                default: false
                            contentMetadata:
                                type: object
                                properties:
                                    fileSize:
                                        type: integer
                                        format: int64
                                        description: The size of the file in bytes, only needed for CREATE actions
                                    contentType:
                                        type: string
                                        description: The id of the crafter content type, only needed for CREATE actions
                        required:
                            - type
                            - target
            required:
                - siteId
                - actions

        ContentValidationResult:
            type: object
            properties:
                actions:
                    type: array
                    description: The list of results
                    items:
                        type: object
                        properties:
                            type:
                                type: string
                                description: The type of action
                            target:
                                type: string
                                description: The target value
                            allowed:
                                type: boolean
                                description: Indicates if the operation is allowed
                            modifiedValue:
                                type: string
                                description: The adjusted value if available
                            message:
                                type: string
                                description: A detail message for the validation result

        ChildrenByPathRequest:
            type: object
            properties:
                path:
                    description: item path to get children for
                    type: string
                localeCode:
                    description: |-
                        filter children by locale code, or show source items (not translation) if translation to
                        specified locale code does not exist
                    type: string
                sortStrategy:
                    description: >-
                        sort strategy (sort order)
                        Possible values:
                          - alphabetical (default)
                          - foldersFirst (order by: folders alphabetical, files alphabetical)
                          - lastUpdated (order by: dateModified)
                    type: string
                order:
                    description: order for sort strategy ascending or descending (ASC / DESC)
                    type: string
                    format: ASC, DESC
                offset:
                    description: offset of first child in response - default 0
                    type: integer
                limit:
                    description: number of children to return
                    type: integer
                keyword:
                    description: filter children by keyword
                    type: string
                systemTypes:
                    description: |-
                        filter children by system type

                        Note that this parameter does not honor "levelDescriptor" as a valid type
                    type: array
                    items:
                        type: string
                excludes:
                    description: exclude items by path
                    type: array
                    items:
                        type: string

        PasteRequest:
            type: object
            properties:
                operation:
                    type: string
                    description: Indicate the type of operation
                    enum:
                        - COPY
                        - CUT
                targetPath:
                    type: string
                    description: The target path for the operation
                sourcePath:
                    type: string
                    description: The source path for the operation
                includeChildren:
                    type: boolean
                    description: for copy, indicates if children should be copied as well.
                    default: false
            required:
                - operation
                - targetPath
                - sourcePath

        AccessToken:
            type: object
            properties:
                token:
                    type: string
                    description: Value of the access token, only visible when the token is created
                expiresAt:
                    type: string
                    format: date-time
                    description: Date of expiration of the access token
                id:
                    type: integer
                    format: int64
                    description: Id of the access token
                label:
                    type: string
                    description: The label of the access token
                enabled:
                    type: boolean
                    description: Indicates if the access token is enabled
                createdOn:
                    type: string
                    format: date-time
                    description: Date of creation of the access token

        WorkflowPackage:
            type: object
            properties:
                id:
                    type: string
                    description: workflow package ID
                siteId:
                    type: string
                    description: site identifier
                status:
                    type: string
                    description: workflow package status
                author:
                    type: string
                    description: username of the author
                reviewer:
                    type: string
                    description: username of the reviewer
                schedule:
                    type: string
                    format: datetime
                    description: scheduled date and time to publish the package
                publishingTarget:
                    type: string
                    description: name of the publishing target where package will be published
                authorComment:
                    type: string
                    description: author's comment
                reviewerComment:
                    type: string
                    description: reviewer's comment
                label:
                    type: string
                    description: user friendly label for package
            required:
                - id
                - siteId
                - status
                - author
                - publishingTarget

        Activity:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                    description: activity ID
                person:
                    $ref: '#/components/schemas/Person'
                actionType:
                    type: string
                    description: >-
                        operation performed by user
                          * CREATE
                          * UPDATE
                          * DELETE
                          * MOVE
                          * REQUEST_PUBLISH
                          * APPROVE
                          * APPROVE_SCHEDULED
                          * REJECT
                          * REVERT
                          * PUBLISH
                          * INITIAL_PUBLISH
                          * UNKNOWN
                item:
                    type: object
                    description: item that operation was performed against
                    properties:
                        id:
                            type: integer
                            format: int64
                            description: The id of the item
                        path:
                            type: string
                            description: The path of the item
                        label:
                            type: string
                            description: The label of the item
                        previewUrl:
                            type: string
                            description: The preview URL of the item
                package:
                    type: object
                    description: package that operation was performed against
                    properties:
                        id:
                            type: string
                            format: UUID
                            description: The id of the package
            required:
                - id
                - person
                - actionType

        Person:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                    description: user ID
                username:
                    type: string
                    description: user's username
                firstName:
                    type: string
                    description: user's first name
                lastName:
                    type: string
                    description: user's last name
                avatar:
                    type: string
                    format: CLOB
                    description: user's avatar
            required:
                - id
                - username
                - firstName
                - lastName

        PublishingStats:
            type: object
            properties:
                numberOfPublishes:
                    type: integer
                    format: int32
                    description: Number of published content for given unit of time
                numberOfNewAndPublishedItems:
                    type: integer
                    format: int32
                    description: Number of newly created and published items for given unit of time
                numberOfEditedAndPublishedItems:
                    type: integer
                    format: int32
                    description: Number of edited and published items for given unit of time
            required:
                - numberOfPublishes
                - numberOfNewAndPublishedItems
                - numberOfEditedAndPublishedItems

        LoggerConfig:
            type: object
            properties:
                name:
                    type: string
                    description: the logger name
                level:
                    type: string
                    description: the logger priority level (off|error|warn|info|debug|trace|all)
            required:
                - name
                - level

        LoggerConfigRequest:
            allOf:
                -   $ref: '#/components/schemas/LoggerConfig'
                -   type: object
                    properties:
                        createIfAbsent:
                            type: boolean
                            description: if true, the logger will be created in case it does not exist yet.
                                If false, a 404 status code will be returned if logger is not in the registry.

        ItemVersion:
            type: object
            description: represents a version of a content item in the repository
            allOf:
                -  $ref: '#/components/schemas/RepositoryVersion'
                -   type: object
                    properties:
                        path:
                            type: string
                            description: the path of the item
                        oldPath:
                            type: string
                            description: the old path of the item (will be the same as path if the item has not been renamed)
                        revertible:
                            type: boolean
                            description: true if a revert to this version will be allowed

        DuplicateSiteRequest:
            type: object
            properties:
                siteName:
                    type: string
                    description: The name of the new site
                siteId:
                    type: string
                    description: The ID of the new site
                description:
                    type: string
                    description: The description of the new site
                sandboxBranch:
                    type: string
                    description: The sandbox branch to be used in the new site sandbox repository
                readOnlyBlobStores:
                    type: boolean
                    description: If true, the blob stores will be read-only in the copied site.
                    default: false

        ContentType:
            type: object
            description: Represents a content type in the system.
            properties:
                id:
                    type: string
                    description: Unique identifier for the content type.
                label:
                    type: string
                    description: Human-readable label for the content type.
                type:
                    type: string
                    description: The type of content.
                    enum: [PAGE, COMPONENT, UNKNOWN]
                allowedRoles:
                    type: array
                    description: Set of roles allowed to access this content type.
                    items:
                        type: object
                        description: Role allowed to access the content type.
                        properties:
                            name:
                                type: string
                                description: Name of the role.
                deleteDependencies:
                    type: array
                    description: List of dependencies to delete with this content type.
                    items:
                        type: object
                        description: Dependency to delete with the content type.
                        properties:
                            pattern:
                                type: string
                                description: Pattern for the dependency to delete.
                            removeEmptyFolder:
                                type: boolean
                                description: Whether to remove the folder if it becomes empty after deletion.
                copyDependencies:
                    type: array
                    description: List of dependencies to copy with this content type.
                    items:
                        type: object
                        description: Dependency to copy with the content type.
                        properties:
                            pattern:
                                type: string
                                description: Pattern for the dependency to copy.
                            target:
                                type: string
                                description: Target path for the copied dependency.
                previewable:
                    type: boolean
                    description: Whether the content type is previewable.
                imageThumbnail:
                    type: string
                    description: Path or URL to the thumbnail image.
                noThumbnail:
                    type: boolean
                    description: Whether the content type has no thumbnail.
                pathIncludes:
                    type: array
                    items:
                        type: string
                    description: List of path patterns to include.
                pathExcludes:
                    type: array
                    items:
                        type: string
                    description: List of path patterns to exclude.
                quickCreate:
                    type: boolean
                    description: Whether quick create is enabled for this content type.
                quickCreatePath:
                    type: string
                    description: Path to use for quick create.

        ReorderItemRequestBase:
            type: object
            properties:
                type:
                    type: string
                    description: The type of the reorder request
                    enum:
                        - addBefore
                        - insertBetween
                        - addAfter
            required:
                - type

        ReorderItemReferencePathRequest:
            allOf:
                -   $ref: '#/components/schemas/ReorderItemRequestBase'
                -   type: object
                    properties:
                        type:
                            type: string
                            enum:
                                - addBefore
                                - addAfter
                        referencePath:
                            type: string
                            description: The reference path to reorder
                    required:
                        - referencePath
                        - type

        ReorderItemInsertBetweenRequest:
            allOf:
                -   $ref: '#/components/schemas/ReorderItemRequestBase'
                -   type: object
                    properties:
                        type:
                            type: string
                            enum:
                                - insertBetween
                        previousPath:
                            type: string
                            description: The sibling item that is expected to be before the current item
                        nextPath:
                            type: string
                            description: The sibling item that is expected to be after the current item
                    required:
                        - previousPath
                        - nextPath
                        - type

        ContentItemVersions:
            type: object
            properties:
                lastModifiedDate:
                    type: string
                    description: The item's last modified date
                lastModifier:
                    type: string
                    description: The user that last modified the item
                versionNumber:
                    type: string
                    description: The item's version number
                contentItem:
                    type: string
                    description: The item content
                comment:
                    type: string
                    description: The comment

        AvailableLanguage:
            type: object
            properties:
                id:
                    type: string
                    description: The language code, e.g. ja
                label:
                    type: string
                    description: The language display name

        RepositoryVersion:
            type: object
            properties:
                versionNumber:
                    type: string
                    description: the commit id
                committer:
                    type: string
                    description: the committer of the commit according to git log
                author:
                    $ref: '#/components/schemas/Person'
                    description: corresponds to the Studio user author of the commit (if any)
                modifiedDate:
                    type: string
                    format: date-time
                    description: the date of the commit
                comment:
                    type: string
                    description: the comment of the commit

        WriteContentResponse:
            type: object
            description: describes the result of a write content operation
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/WriteContentResultItem'
                    example:
                        - path: '/site/website/page1/index.xml'
                          action: UPDATED
                          amended: true
                        - path: '/site/website/page1/summary/index.xml'
                          action: NEW
                          amended: false
                        - path: '/site/website/page1/draft/index.xml'
                          action: DELETED
                          amended: false
            required:
                - items

        WriteContentResultItem:
            type: object
            description: the result of a write content operation
            properties:
                path:
                    type: string
                    description: the content item path
                action:
                    type: string
                    description: the action performed for the item
                    enum:
                        - NEW
                        - COPIED
                        - DUPLICATED
                        - UPDATED
                        - RENAMED
                        - REVERTED
                        - DELETED
                amended:
                    type: boolean
                    description: 'indicates if the content submitted was further updated (e.g.: lifecycle controller, asset pipeline)'
            required:
                - path
                - action
                - amended

        PaginatedResponse:
            type: object
            description: pagination response information
            properties:
                total:
                    type: integer
                    format: int32
                    description: Total records in the system
                offset:
                    type: integer
                    format: int32
                    description: Offset of first record in this response
                limit:
                    type: integer
                    format: int32
                    description: Number of records returned in this response

    responses:
        NotFound:
            description: Resource not found
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            response:
                                $ref: '#/components/schemas/ApiResponse'
        Conflict:
            description: Resource already exists
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            response:
                                $ref: '#/components/schemas/ApiResponse'
        BadRequest:
            description: Invalid request
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            result:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
        Unauthorized:
            description: Unauthorized
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            response:
                                $ref: '#/components/schemas/ApiResponse'
        Forbidden:
            description: Forbidden
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            response:
                                $ref: '#/components/schemas/ApiResponse'
        RequestTimeout:
            description: Request Timeout (408)
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            response:
                                $ref: '#/components/schemas/ApiResponse'
        PublishConflict:
            description: Resource (or child content) is in publishing queue
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            response:
                                $ref: '#/components/schemas/ApiResponse'
                            publishPackages:
                                type: array
                                items:
                                    $ref: '#/components/schemas/PublishPackage'
        InternalServerError:
            description: Internal system failure
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            response:
                                $ref: '#/components/schemas/ApiResponse'
        ServiceUnavailable:
            description: Service unavailable (503)
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            response:
                                $ref: '#/components/schemas/ApiResponse'
        api1OK:
            description: OK
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message:
                                type: string
                        example:
                            message: "OK"
        api1NotFound:
            description: Resource not found
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message:
                                type: string
                        example:
                            message: "Site not found"
        api1BadRequest:
            description: Invalid request
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message:
                                type: string
                    examples:
                        invalidParameter:
                            value:
                                message: "Invalid parameter: site_id"
                        pathMissing:
                            value:
                                message: "Path must be provided"
                        siteMissing:
                            value:
                                message: "Site must be provided"
        api1Forbidden:
            description: Forbidden
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message:
                                type: string
                        example:
                            message: "Forbidden"
        api1Unauthorized:
            description: Unauthorized
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message:
                                type: string
                        example:
                            message: "Unauthorized"
        api1Conflict:
            description: Resource already exists
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message:
                                type: string
                        example:
                            message: "Site already exists"

        api1PublishConflict:
            description: Resource is in publishing queue
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message:
                                type: string
                            publishPackages:
                                type: array
                                items:
                                    $ref: '#/components/schemas/PublishPackage'

        api1InternalServerError:
            description: Internal system failure
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message:
                                type: string
                        example:
                            message: "Internal server error. ACTUAL_EXCEPTION"
    securitySchemes:
        jwtAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
        basicAuth:
            type: http
            scheme: basic
        managementToken:
            type: apiKey
            in: query
            name: token
    links: { }
    callbacks: { }
security:
    -   jwtAuth: [ ]
    -   basicAuth: [ ]
