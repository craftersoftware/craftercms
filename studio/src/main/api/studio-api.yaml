        get:
            tags:
                - audit
            summary: Get audit log
            description: |
                    Module: Studio <br>
                    Required permission "AUDIT_LOG"
            operationId: getAuditLog
            parameters:
                -   name: siteId
                    in: query
                    description: Site ID (site identifier) - optional for super admin user, otherwise required
                    required: false
                    schema:
                        type: string
                -   name: offset
                    in: query
                    description: Offset of first record in the response
                    required: false
                    schema:
                        type: integer
                        format: int32
                -   name: limit
                    in: query
                    description: Number of records to return
                    required: false
                    schema:
                        type: integer
                        format: int32
                -   name: user
                    in: query
                    description: Filter log by user name
                    required: false
                    schema:
                        type: string
                -   name: operations
                    in: query
                    description: Filter log by operations
                    required: false
                    schema:
                        type: array
                        items:
                            type: string
                -   name: includeParameters
                    in: query
                    description: Include parameters into result set if `true`. Default `false`
                    required: false
                    schema:
                        type: boolean
                -   name: dateFrom
                    in: query
                    description: Lower boundary in date range query
                    required: false
                    schema:
                        type: string
                -   name: dateTo
                    in: query
                    description: Upper boundary in date range query
                    required: false
                    schema:
                        type: string
                -   name: target
                    in: query
                    description: Regular expression to filter target values
                    required: false
                    schema:
                        type: string
                -   name: origin
                    in: query
                    description: Origin filter for audit log. Possible values `API` and `GIT`
                    required: false
                    schema:
                        type: string
                -   name: clusterNodeId
                    in: query
                    description: Cluster node id filter for audit log
                    required: false
                    schema:
                        type: string
                -   name: sort
                    in: query
                    description: Sort result set by specified field. Possible values `date`.
                    required: false
                    schema:
                        type: string
                -   name: order
                    in: query
                    description: Order in sorted result. Possible values `ASC` and `DESC`
                    required: false
                    schema:
                        type: string
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    response:
                                        $ref: '#/components/schemas/ApiResponse'
                                    total:
                                        type: integer
                                        format: int32
                                        description: Total records in the system
                                    offset:
                                        type: integer
                                        format: int32
                                        description: Offset of first record in this response
                                    limit:
                                        type: integer
                                        format: int32
                                        description: Number of records returned in this response
                                    auditLog:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/AuditLog'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalServerError'

