    # Pipeline to upgrade site repositories
    site:
        requires: '>=4.0.0'
        versions:
            # 4.0 main pipeline (version older than 2 months removed for simplicity)
            -   currentVersion: 4.0.0.1
                nextVersion: 4.0.0.2
                operations:
                    -   type: batchXsltUpgrader
                        regex: config/studio/content-types/.+/form-definition\.xml
                        template: crafter/studio/upgrade/4.0.x/4.0.0.2/site/rte-refactor.xslt
                        commitDetails: Update all usages of RTE
                    -   type: deleteUpgrader
                        paths:
                            - config/studio/form-control-config/rte/rte-setup.xml
                        commitDetails: Delete legacy RTE configuration
                    -   type: renameUpgrader
                        oldPath: config/studio/form-control-config/rte/rte-setup-tinymce5.xml
                        newPath: config/studio/form-control-config/rte/rte-config.xml
                        commitDetails: Rename the RTE configuration
            -   currentVersion: 4.0.0.2
                nextVersion: 4.0.0.3
                operations:
                    -   type: batchXsltUpgrader
                        regex: config/studio/content-types/.+/form-definition\.xml
                        template: crafter/studio/upgrade/4.0.x/4.0.0.3/site/additional-fields.xslt
                        commitDetails: Update date-time & time controls with additional fields
            -   currentVersion: 4.0.0.3
                nextVersion: 4.0.0.4
                operations:
                    -   type: findAndReplaceUpgrader
                        includedPaths:
                            - templates/system/plugins/.*\.ftl
                        pattern: '<#include "([^"]+)" ignore_missing=true\/><#-- pluginId:([^\s]+) -->'
                        replacement: '<@plugin_include "$2" "$1"/><#-- pluginId:$2 -->'
                        commitDetails: Update plugin includes to use new macro
            -   currentVersion: 4.0.0.4
                nextVersion: 4.0.0.5
                operations:
                    -   type: deleteUpgrader
                        paths:
                            - config/studio/context-nav/sidebar.xml
                            - config/studio/form-control-config/rte/rte-config.xml
                            - config/studio/code-editor-config.xml
                            - config/studio/targeting/targeting-config.xml
                            - config/studio/preview-tools/panel.xml
                            - config/studio/context-nav/contextual-nav.xml
                            - config/studio/mime-type.xml
                        commitDetails: Delete unused configurations
            -   currentVersion: 4.0.0.5
                nextVersion: 4.0.0.6
                operations:
                    -   type: xsltFileUpgrader
                        path: /config/studio/site-policy-config.xml
                        template: crafter/studio/upgrade/4.0.x/4.0.0.6/site/site-policy-config.xslt
                        commitDetails: Update site-policy-config.xml to prevent asset file names from including parenthesis
            -   currentVersion: 4.0.0.6
                nextVersion: 4.0.0.7
                operations:
                    -   type: batchXsltUpgrader
                        regex: config/studio/content-types/.+/form-definition\.xml
                        template: crafter/studio/upgrade/4.0.x/4.0.0.7/site/update-content-type-datasources.xslt
                        commitDetails: Update datasources components and simpleTaxonomy
            -   currentVersion: 4.0.0.7
                nextVersion: 4.0.0.8
                operations:
                    -   type: deleteUpgrader
                        paths:
                            - config/studio/data-sources/cmis-config.xml
                        commitDetails: Delete CMIS configurations
            -   currentVersion: 4.0.0.8
                nextVersion: 4.1.0
                operations:
                    -   type: multiFindAndReplaceUpgrader
                        includedPaths:
                            - (config/studio/)?scripts/.*\.groovy
                        rules:
                            -   pattern: "import\\s+(static\\s+)?co\\.elastic\\.clients\\.elasticsearch\\.(.*)(\\r*\\n*\\s*)"
                                replacement: 'import $1org.opensearch.client.opensearch.$2$3'
                            -   pattern: "import\\s+(static\\s+)?co\\.elastic\\.clients\\.(.*)(\\r*\\n*\\s*)"
                                replacement: 'import $1org.opensearch.client.$2$3'
                            -   pattern: "import\\s+(static\\s+)?org\\.elasticsearch\\.(.*)(\\r*\\n*\\s*)"
                                replacement: 'import $1org.opensearch.$2$3'
                            -   pattern: "import\\s+(static\\s+)?org\\.craftercms\\.search\\.elasticsearch\\.(.*)(\\r*\\n*\\s*)"
                                replacement: 'import $1org.craftercms.search.opensearch.$2$3'
                            -   pattern: "\\bElasticsearchClientWrapper\\b"
                                replacement: 'OpenSearchClientWrapper'
                            -   pattern: "\\bElasticsearchAdminService\\b"
                                replacement: 'OpenSearchAdminService'
                            -   pattern: "\\bElasticsearchService\\b"
                                replacement: 'OpenSearchService'
                            -   pattern: "\\bElasticsearchWrapper\\b"
                                replacement: 'OpenSearchWrapper'
                            -   pattern: "\\bElasticsearchBinaryFileBatchIndexer\\b"
                                replacement: 'OpenSearchBinaryFileBatchIndexer'
                            -   pattern: "\\bElasticsearchBinaryFileWithMetadataBatchIndexer\\b"
                                replacement: 'OpenSearchBinaryFileWithMetadataBatchIndexer'
                            -   pattern: "\\bElasticsearchIndexingUtils\\b"
                                replacement: 'OpenSearchIndexingUtils'
                            -   pattern: "\\bElasticsearchXmlFileBatchIndexer\\b"
                                replacement: 'OpenSearchXmlFileBatchIndexer'
                            -   pattern: "\\bAuthoringElasticsearchBinaryFileWithMetadataBatchIndexer\\b"
                                replacement: 'AuthoringOpenSearchBinaryFileWithMetadataBatchIndexer'
                            -   pattern: "\\bElasticsearchClientWrapper\\b"
                                replacement: 'OpenSearchClientWrapper'
                            -   pattern: "\\bElasticsearchException\\b"
                                replacement: 'OpenSearchException'
                            -   pattern: "\\bAbstractElasticsearchWrapper\\b"
                                replacement: 'AbstractOpenSearchWrapper'
                            -   pattern: "\\bMultiElasticsearchAdminServiceImpl\\b"
                                replacement: 'MultiOpenSearchAdminServiceImpl'
                            -   pattern: "\\bMultiElasticsearchServiceImpl\\b"
                                replacement: 'MultiOpenSearchServiceImpl'
                            -   pattern: "\\bElasticsearchAdminServiceImpl\\b"
                                replacement: 'OpenSearchAdminServiceImpl'
                            -   pattern: "\\bElasticsearchDocumentBuilder\\b"
                                replacement: 'OpenSearchDocumentBuilder'
                            -   pattern: "\\bElasticsearchElementParserImpl\\b"
                                replacement: 'OpenSearchElementParserImpl'
                            -   pattern: "\\bElasticsearchServiceImpl\\b"
                                replacement: 'OpenSearchServiceImpl'
                            -   pattern: "\\bAbstractElasticsearchClientWrapper\\b"
                                replacement: 'AbstractOpenSearchClientWrapper'
                            -   pattern: "\\bElasticsearchClientFactory\\b"
                                replacement: 'OpenSearchClientFactory'
                            -   pattern: "\\bElasticsearchClient\\b"
                                replacement: 'OpenSearchClient'
                        commitDetails: Migrate Elasticsearch to OpenSearch
            -   currentVersion: 4.1.0
                nextVersion: 4.1.1
                operations:
                    -   type: findAndReplaceUpgrader
                        pattern: "\\s*searchEngine\\:.*"
                        replacement: ""
                        commitDetails: Remove searchEngine property from plugin descriptor
                        includedPaths:
                            - craftercms-plugin.yaml
            -   currentVersion: 4.1.1
                nextVersion: 4.1.2
                operations:
                    -   type: xsltFileUpgrader
                        path: /config/studio/site-policy-config.xml
                        template: crafter/studio/upgrade/4.1.x/site-policy-config/site-policy-config-v4.1.2.xslt
                        commitDetails: Sync Studio version to 4.1.2
            -   currentVersion: 4.1.2
                nextVersion: 5.0-t
            # Entry point for 5.0 upgrade
            -   currentVersion: 5.0-t
                nextVersion: 5.0.0.0
                operations:
                    -   type: checkContentTypeControllerUpgrader
                        includedPaths:
                            -   config/studio/content-types/.*/controller\.groovy
                        commitDetails: Remove unnecessary controller.groovy files. Comment out custom scripts
            -   currentVersion: 5.0.0.0
                nextVersion: 5.0.0.1
                operations:
                    -   type: multiFindAndReplaceUpgrader
                        includedPaths:
                            - scripts/.*\.groovy
                        rules:
                            -   pattern: "\\._toQuery\\(\\)"
                                replacement: '.toQuery()'
                        commitDetails: Upgrade to OpenSearch 3 in site scripts
            -   currentVersion: 5.0.0.1
                nextVersion: 5.0.0.2
                operations:
                    -   type: contentTypeConfigMergeUpgrader
                        regex: config/studio/content-types/.+/form-definition\.xml
                        template: crafter/studio/upgrade/5.0.x/content-type/content-type-merge-v5.0.0.2.xslt
                        commitDetails: Merge content type config.xml into form-definition.xml and remove config.xml files

