                                        "_id": "59663b4be61296e1be353596"
                                    },
                                    {
                                        "actionName": "system.socialctx.removeProfile",
                                        "roles": [
                                            "SOCIAL_SUPERADMIN",
                                            "SOCIAL_ADMIN"
                                        ],
                                        "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                        "_id": "59663b4be61296e1be353597"
                                    },
                                    {
                                        "actionName": "system.notification.changeTemplate",
                                        "roles": [
                                            "SOCIAL_SUPERADMIN",
                                            "SOCIAL_ADMIN"
                                        ],
                                        "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                        "_id": "59663b4be61296e1be3535ab"
                                    },
                                    {
                                        "actionName": "ugc.voting",
                                        "roles": [
                                            "SOCIAL_SUPERADMIN",
                                            "SOCIAL_ADMIN",
                                            "SOCIAL_MODERATOR",
                                            "SOCIAL_USER"
                                        ],
                                        "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                        "_id": "59663b4be61296e1be3535ca"
                                    }
                                ]
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        post:
            security: []
            tags:
                - actions
            summary: Update Actions
            operationId: updateActions
            description: |
                Module: Social <br>
                Updates the given action name with the Roles.
            parameters:
                - name: context
                  in: query
                  description: The ID of the Social Context
                  required: true
                  schema:
                      type: string
                  example: f5b143c2-f1c0-4a10-b56e-f485f00d3fe9
                - name: actionName
                  in: query
                  description: The name of the action to update
                  required: true
                  schema:
                      type: string
                  example: ugc.moderate
                - name: roles
                  in: query
                  description: List of roles to assign to the action
                  required: true
                  schema:
                      type: string
                  example: CUSTOM_MODERATOR,SOCIAL_SUPERADMIN,SOCIAL_ADMIN,SOCIAL_MODERATOR
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Action'
                            example:
                                {
                                    "actionName": "ugc.moderate",
                                    "roles": [
                                        "SOCIAL_SUPERADMIN",
                                        "CUSTOM_MODERATOR",
                                        "SOCIAL_ADMIN",
                                        "SOCIAL_MODERATOR"
                                    ],
                                    "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                    "_id": "59663b4be61296e1be35358c"
                                }
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/3/system/context/all:
        get:
            security: []
            tags:
                - context
            summary: Get All Social Contexts
            operationId: getAllSocialContexts
            description: |
                Module: Social <br>
                Returns a list of all Social Contexts.
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Context'
                            example:
                                [
                                    {
                                        "contextName": "Default",
                                        "_id": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9"
                                    }
                                ]
                '400':
                    $ref: '#/components/responses/Unauthorized'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/3/system/context/:
        post:
            security: []
            tags:
                - context
            summary: Create Social Context
            operationId: createSocialContext
            description: |
                Module: Social <br>
                Creates a new Social Context.
            parameters:
                - name: context
                  in: query
                  description: The ID of the Social Context
                  required: true
                  schema:
                      type: string
                  example: f5b143c2-f1c0-4a10-b56e-f485f00d3fe9
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contextName:
                                    type: string
                                    description: The name of the new Social Context
                                    example: site1
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Context'
                            example:
                                {
                                    "contextName": "site1",
                                    "_id": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9"
                                }
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/3/system/context/{id}/{profileId}:
        post:
            security: []
            tags:
                - context
            summary: Add Profile To Social Context
            operationId: addProfileToSocialContext
            description: |
                Module: Social <br>
                Updates the socialContext attribute in the given profile to include the Social Context ID and the list of roles assigned for that context.
            parameters:
                - name: id
                  in: path
                  description: The ID of the Social Context to add
                  required: true
                  schema:
                      type: string
                  example: e41e7273-b504-4d50-9edd-3b215eff6464
                - name: profileId
                  in: path
                  description: The ID of the profile to update
                  required: true
                  schema:
                      type: string
                  example: 596683c030047dc279c21d27
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                context:
                                    type: string
                                    description: The ID of the Social Context
                                    example: f5b143c2-f1c0-4a10-b56e-f485f00d3fe9
                                roles:
                                    type: string
                                    description: The list of roles to assign
                                    example: SOCIAL_USER
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SocialContextProfile'
                            example:
                                {
                                    "username": "john.doe",
                                    "email": "john.doe@example.com",
                                    "verified": false,
                                    "enabled": false,
                                    "createdOn": "2017-07-12T14:17Z",
                                    "lastModified": "2017-07-12T14:37Z",
                                    "tenant": "sample-tenant",
                                    "roles": [],
                                    "attributes": {
                                        "firstName": "John",
                                        "lastName": "Doe",
                                        "socialContexts": [
                                            {
                                                "roles": [
                                                    "SOCIAL_USER"
                                                ],
                                                "name": "site1",
                                                "id": "e41e7273-b504-4d50-9edd-3b215eff6464"
                                            }
                                        ]
                                    },
                                    "id": "596683c030047dc279c21d27"
                                }
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/3/system/context/{id}/{profileId}/delete:
        post:
            security: []
            tags:
                - context
            summary: Remove Profile from Social Context
            operationId: removeProfileFromSocialContext
            description: |
                Module: Social <br>
                Updates the socialContext attribute in the given profile to remove the Social Context ID and the list of roles assigned for that context.
            parameters:
                - name: id
                  in: path
                  description: The ID of the Social Context to remove
                  required: true
                  schema:
                      type: string
                  example: e41e7273-b504-4d50-9edd-3b215eff6464
                - name: profileId
                  in: path
                  description: The ID of the profile to update
                  required: true
                  schema:
                      type: string
                  example: 596683c030047dc279c21d27
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                context:
                                    type: string
                                    description: The ID of the Social Context
                                    example: f5b143c2-f1c0-4a10-b56e-f485f00d3fe9
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SocialContextProfile'
                            example:
                                {
                                    "username": "john.doe",
                                    "email": "john.doe@example.com",
                                    "verified": false,
                                    "enabled": false,
                                    "createdOn": "2024-07-12T14:17Z",
                                    "lastModified": "2024-07-12T14:37Z",
                                    "tenant": "sample-tenant",
                                    "roles": [],
                                    "attributes": {
                                        "firstName": "John",
                                        "lastName": "Doe",
                                        "socialContexts": []
                                    },
                                    "id": "596683c030047dc279c21d27"
                                }
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/3/system/context/preferences/email/config:
        post:
            security: []
            tags:
                - context
            summary: Update Email Configuration
            operationId: updateEmailConfiguration
            description: |
                Module: Social <br>
                Updates the email configuration for a given Social Context.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                context:
                                    type: string
                                    description: The ID of the Social Context
                                    example: f5b143c2-f1c0-4a10-b56e-f485f00d3fe9
                                encoding:
                                    type: string
                                    description: Character encoding for the email body
                                    example: UTF-8
                                host:
                                    type: string
                                    description: The hostname of the email server
                                    example: mail.example.com
                                port:
                                    type: string
                                    description: The port of the email server
                                    example: 25
                                auth:
                                    type: boolean
                                    description: Enable if the email server requires authentication
                                    example: true
                                username:
                                    type: string
                                    description: The username for the email server
                                    example: user
                                password:
                                    type: string
                                    description: The password for the email server
                                    example: passw0rd
                                tls:
                                    type: boolean
                                    description: Enable if the email server requires a secure connection
                                    example: true
                                replyTo:
                                    type: string
                                    description: Email address used for replies
                                    example: reply@example.com
                                from:
                                    type: string
                                    description: Email address used to send notifications
                                    example: site1@example.com
                                priority:
                                    type: integer
                                    description: The priority for the emails
                                    example: 3
                                subject:
                                    type: string
                                    description: The subject for the emails
                                    example: Site1 Updates
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SocialContextEmailConfiguration'
                            example:
                                {
                                    "password": "passw0rd",
                                    "port": 25,
                                    "auth": true,
                                    "subject": "Site1 Updates",
                                    "host": "mail.example.com",
                                    "replyTo": "reply@example.com",
                                    "tls": true,
                                    "from": "site1@example.com",
                                    "encoding": "UTF-8",
                                    "priority": 3,
                                    "username": "user"
                                }
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        get:
            security: []
            tags:
                - context
            summary: Get Email Configuration
            operationId: getEmailConfiguration
            description: |
                Module: Social <br>
                Returns an email configuration for a given Social Context.
            parameters:
                - name: context
                  in: query
                  description: The ID of the Social Context
                  required: true
                  schema:
                      type: string
                  example: f5b143c2-f1c0-4a10-b56e-f485f00d3fe9
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SocialContextEmailConfiguration'
                            example:
                                {
                                    "host": "localhost",
                                    "encoding": "UTF-8",
                                    "port": 25.0,
                                    "auth": false,
                                    "username": "",
                                    "password": "",
                                    "tls": false,
                                    "replyTo": "social@example.com",
                                    "from": "social@example.com",
                                    "priority": 5.0,
                                    "subject": "Latest change on your subscribed threads for Social"
                                }
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/3/system/context/preferences/email:
        post:
            security: []
            tags:
                - context
            summary: Update Email Template
            operationId: updateEmailTemplate
            description: |
                Module: Social <br>
                Updates an email template for a given Social Context.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                context:
                                    type: string
                                    description: The ID of the Social Context
                                    example: f5b143c2-f1c0-4a10-b56e-f485f00d3fe9
                                template:
                                    type: string
                                    description: The body of the email template
                                    example: Sample template for email
                                type:
                                    type: string
                                    description: |-
                                        The type of the email template<br>
                                        The possible values for the type parameter are:
                                        <ul>
                                        <li>DAILY</li>
                                        <li>WEEKLY</li>
                                        <li>INSTANT</li>
                                        <li>APPROVEREMAIL</li>
                                        <li>APPROVER_RESULT_TEMPLATE</li>
                                        </ul>
                                    example: INSTANT
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: boolean
                            example:
                                true
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        get:
            security: []
            tags:
                - context
            summary: Get Email Template
            operationId: getEmailTemplate
            description: |
                Module: Social <br>
                Returns an email template for a given Social Context.
            parameters:
                - name: context
                  in: query
                  description: The ID of the Social Context
                  required: true
                  schema:
                      type: string
                  example: f5b143c2-f1c0-4a10-b56e-f485f00d3fe9
                - name: type
                  in: query
                  required: true
                  schema:
                      type: string
                      description: |-
                          The type of the email template<br>
                          The possible values for the type parameter are:
                          <ul>
                          <li>DAILY</li>
                          <li>WEEKLY</li>
                          <li>INSTANT</li>
                          <li>APPROVEREMAIL</li>
                          <li>APPROVER_RESULT_TEMPLATE</li>
                          </ul>
                  example: INSTANT
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    template:
                                        type: string
                            example:
                                {
                                    "template": "Hi ${profile.username} this are changes that happen on your subscribe Threads<#list digest as change><h1> ${change[\"_id\"]} </h1><dl><#list change.ugcList as ugc><dt>Subject</dt><dd> ${ugc.subject!\"\"} </dd><dt>Body</dt>  <dd>${ugc.body!\"\"} </dd><dt>Changed by<dt><dd>${ugc.lastModifiedBy.username}<dd></#list></dl></#list>"
                                }
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /api/3/system/context/preferences:
        get:
