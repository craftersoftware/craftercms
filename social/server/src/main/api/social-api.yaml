openapi: 3.0.0
servers:
    - url: 'http://localhost:8080/crafter-social'
info:
    description: |-
        Crafter Social API

        All request in this API require the user to be authenticated with the following steps:

        1. Send a **POST** request to the **/crafter-social/crafter-security-login** endpoint with the **_username_** and **_password_** parameters

        2. Include the cookies set in the response of the login in later requests

        Besides setting the authentication cookies the login response also provides the user’s information:

        ```
        {
            "ticket":"0489ca78-cd96-46c2-bc96-c1ea1fa4db6f",
            "profile":{
                "username":"admin",
                "password":null,
                "email":"admin@example.com",
                "verified":false,
                "enabled":true,
                "createdOn":1554832283831,
                "lastModified":1554834126479,
                "tenant":"default",
                "roles":[
                    "SOCIAL_SUPERADMIN",
                    "PROFILE_SUPERADMIN"
                ],
                "attributes":{
                    "socialContexts":[
                        {
                            "name":"Default",
                            "id":"f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                            "roles":[
                                "SOCIAL_ADMIN",
                                "SOCIAL_MODERATOR",
                                "SOCIAL_USER"
                            ]
                        }
                    ]
                },
                "failedLoginAttempts":0,
                "lastFailedLogin":null,
                "id":"5cacdb9b386f920d482a5ad4"
            },
            "remembered":false
        }
        ```

    version: '4.5.2'
    title: Crafter Social
    termsOfService: ''
    contact:
        email: info@craftercms.org
    license:
        name: GPL 3.0
        url: 'https://www.gnu.org/licenses/gpl-3.0.en.html'
externalDocs:
    description: CrafterCMS - Social
    url: 'https://craftercms.com/docs/current/reference/modules/social.html'
tags:
    - name: actions
      description: Security Actions
    - name: context
      description: Social contexts management
    - name: profile
      description: Profile management
    - name: comments
      description: User generated content comments management
    - name: attachments
      description: User generated content attachments management
    - name: votes
      description: User generated content votes management
    - name: threads
      description: User generated content threads management
    - name: monitoring
      description: Monitoring operations

paths:

    /api/3/system/actions:
        get:
            security: []
            tags:
                - actions
            summary: Get Current Actions
            operationId: getCurrentActions
            description: |
                Module: Social <br>
                Gets all Security Actions for current context.
            parameters:
                - name: context
                  in: query
                  description: The ID of the Social Context
                  required: true
                  schema:
                      type: string
                  example: f5b143c2-f1c0-4a10-b56e-f485f00d3fe9
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Action'
                            example:
                                [
                                    {
                                        "actionName": "ugc.update",
                                        "roles": [
                                            "SOCIAL_SUPERADMIN",
                                            "OWNER",
                                            "SOCIAL_ADMIN",
                                            "SOCIAL_MODERATOR"
                                        ],
                                        "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                        "_id": "59663b4be61296e1be35358b"
                                    },
                                    {
                                        "actionName": "ugc.moderate",
                                        "roles": [
                                            "SOCIAL_SUPERADMIN",
                                            "SOCIAL_ADMIN",
                                            "SOCIAL_MODERATOR"
                                        ],
                                        "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                        "_id": "59663b4be61296e1be35358c"
                                    },
                                    {
                                        "actionName": "ugc.unflag",
                                        "roles": [
                                            "SOCIAL_SUPERADMIN",
                                            "SOCIAL_ADMIN",
                                            "SOCIAL_MODERATOR"
                                        ],
                                        "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                        "_id": "59663b4be61296e1be35358d"
                                    },
                                    {
                                        "actionName": "ugc.flag",
                                        "roles": [
                                            "SOCIAL_SUPERADMIN",
                                            "SOCIAL_ADMIN",
                                            "SOCIAL_MODERATOR",
                                            "SOCIAL_USER"
                                        ],
                                        "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                        "_id": "59663b4be61296e1be35358e"
                                    },
                                    {
                                        "actionName": "ugc.create",
                                        "roles": [
                                            "SOCIAL_SUPERADMIN",
                                            "SOCIAL_ADMIN",
                                            "SOCIAL_MODERATOR",
                                            "SOCIAL_USER"
                                        ],
                                        "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                        "_id": "59663b4be61296e1be35358f"
                                    },
                                    {
                                        "actionName": "ugc.delete",
                                        "roles": [
                                            "SOCIAL_SUPERADMIN",
                                            "OWNER",
                                            "SOCIAL_ADMIN",
                                            "SOCIAL_MODERATOR"
                                        ],
                                        "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                        "_id": "59663b4be61296e1be353590"
                                    },
                                    {
                                        "actionName": "ugc.read",
                                        "roles": [
                                            "ANONYMOUS",
                                            "SOCIAL_SUPERADMIN",
                                            "SOCIAL_ADMIN",
                                            "SOCIAL_MODERATOR",
                                            "SOCIAL_USER"
                                        ],
                                        "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                        "_id": "59663b4be61296e1be353591"
                                    },
                                    {
                                        "actionName": "system.securityActions.read",
                                        "roles": [
                                            "SOCIAL_SUPERADMIN",
