components:
    schemas:
        Action:
            type: object
            properties:
                actionName:
                    type: string
                roles:
                    type: array
                    items:
                        type: string
                contextId:
                    type: string
                _id:
                    type: string

        SocialContextProfile:
            type: object
            properties:
                username:
                    type: string
                email:
                    type: string
                verified:
                    type: boolean
                enabled:
                    type: boolean
                createdOn:
                    type: number
                lastModified:
                    type: number
                tenant:
                    type: string
                roles:
                    type: array
                    items:
                        type: string
                attributes:
                    $ref: '#/components/schemas/ProfileAttributes'
                id:
                    type: string

        Context:
            type: object
            description: >-
                Object containing social context for given ID
            properties:
                contextName:
                    type: string
                _id:
                    type: string

        SocialContext:
            type: object
            properties:
                roles:
                    type: array
                    items:
                        type: string
                name:
                    type: string
                id:
                    type: string

        ProfileAttributes:
            type: object
            description: >-
                Object containing attributes for the profile
            properties:
                firstName:
                    type: string
                lastName:
