                                        "contextId": "f5b143c2-f1c0-4a10-b56e-f485f00d3fe9",
                                        "_id": "59663b4be61296e1be353592"
                                    },
                                    {
                                        "actionName": "system.securityActions.update",
                                        "roles": [
                                            "SOCIAL_SUPERADMIN",
