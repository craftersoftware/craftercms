plugins {
	id 'groovy'
	id 'application'
}

group = 'org.craftercms'
version = craftercmsVersion

base {
	archivesName = 'crafter-cli'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion.toInteger())
	}
}

application {
	mainClass = 'org.craftercms.cli.Main'
	applicationName = 'crafter-cli'
}

dependencies {
	implementation platform("org.apache.groovy:groovy-bom:${groovyVersion}")
	implementation 'org.apache.groovy:groovy'
	implementation 'org.apache.groovy:groovy-json'
	implementation libs.picocli
	implementation libs.okhttp.jvm
	implementation libs.commons.csv
}

processResources {
	filesMatching('**/version.txt') {
		expand('project': [version: project.version])
	}
}

tasks.named('startScripts') {
	dependsOn jar
}

tasks.register('assembleCliDistribution', Sync) {
	group = 'build'
	description = 'Assembles the CLI distribution (bin + repo), matching Maven appassembler layout'
	dependsOn tasks.named('startScripts'), configurations.runtimeClasspath, tasks.named('jar')
	into layout.buildDirectory.dir('cli')

	from(tasks.named('startScripts')) {
		into 'bin'
	}
	from(configurations.runtimeClasspath) {
		into 'repo'
	}
	from(tasks.named('jar')) {
		into 'repo'
	}
}

tasks.named('build') {
	dependsOn tasks.named('assembleCliDistribution')
}

apply from: "${rootDir}/gradle/maven-publish.gradle"
apply from: "${rootDir}/gradle/bom.gradle"

tasks.register('cliDistTar', Tar) {
	group = 'distribution'
	description = 'Packages the CLI distribution as tar.gz'
	dependsOn tasks.named('assembleCliDistribution')
	compression = Compression.GZIP
	archiveFileName = "cli-${project.version}.tar.gz"
	from(layout.buildDirectory.dir('cli')) {
		into 'cli'
	}
}
