plugins {
	id 'base'
	id 'com.github.node-gradle.node'
}

import com.github.gradle.node.yarn.task.YarnTask

group = 'org.craftercms'
version = craftercmsVersion

node {
	version = '22.18.0'
	yarnVersion = '1.22.22'
	download = true
	distBaseUrl = null
	workDir = file("${layout.buildDirectory.get()}/nodejs")
	yarnWorkDir = file("${layout.buildDirectory.get()}/yarn")
}

tasks.register('yarnBuild', YarnTask) {
	group = 'build'
	description = 'Builds all studio UI workspaces'
	dependsOn tasks.named('yarn')
	if (getPropertySafelyWithDefaults('travis', 'false').toBoolean()) {
		args.set(['build:all:ci'])
	} else {
		args.set(['build:all'])
	}
}

tasks.register('bomGenerate', YarnTask) {
	group = 'build'
	description = 'Generates CycloneDX BOMs for UI workspaces'
	dependsOn tasks.named('yarn')
	args.set(['bom:generate'])
}

tasks.named('build') {
	dependsOn tasks.named('yarnBuild')
}

tasks.named('clean') {
	delete 'node_modules'
	delete 'ui/guest/node_modules'
	delete 'ui/app/node_modules'
	delete 'ui/legacy/node_modules'
	delete 'ui/npm-content/node_modules'
	delete 'ui/uppy/node_modules'
	delete 'ui/scss/node_modules'
}
