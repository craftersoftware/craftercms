			exclude defaultTomcatLocalBinExcludes
		}

		injected.execOps.exec {
			commandLine 'docker', 'buildx', 'build', '--sbom=true', '--provenance=true', '--target', authoringBuildTarget, '-t', "${project.authoringLocalImageName}:${project.version}", imageBuildDir
		}

		pushTagDockerImage(project.authoringLocalImageName)
