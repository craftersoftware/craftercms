tasks.register('buildAuthoringTomcatWithImageMagick') {
	group = 'Build'
	description = 'Builds the Authoring Tomcat Docker image, including the ImageMagick binary'
	dependsOn buildAuthoringTomcat
	def injected = project.objects.newInstance(InjectedExecOps)
	def imageBuildDir = "${imagesBuildDir}/authoring/tomcat"

	doLast {
		injected.execOps.exec {
			commandLine 'docker', 'buildx', 'build', '--sbom=true', '--provenance=true', '--target', 'imagemagick', '-t', "${project.authoringTomcatWithImageMagickImageName}:${project.version}", imageBuildDir
		}

		pushTagDockerImage(project.authoringTomcatWithImageMagickImageName)
	}
}

tasks.register('buildDeliveryTomcat') {
    group = "Build"
    description = "Builds the Delivery Tomcat Docker image"
    dependsOn prepareDeliveryBundle
    dependsOn copyDeliveryCustomWebapps
	def injected = project.objects.newInstance(InjectedExecOps)
    def imageBuildDir = "${imagesBuildDir}/delivery/tomcat"

    doFirst {
        delete imageBuildDir
    }
    doLast {
        copy {
            from "${imagesDir}/delivery/tomcat/"
            into imageBuildDir
        }

        updateDockerfileUser("${imageBuildDir}/Dockerfile")

        copy {
            from "${deliveryBundleRoot}/bin/"
            into "${imageBuildDir}/bin"
            exclude defaultTomcatBinExcludes
        }

		injected.execOps.exec {
            commandLine 'docker', 'buildx', 'build', '--sbom=true', '--provenance=true', '-t', "${project.deliveryTomcatImageName}:${project.version}", imageBuildDir
        }

        pushTagDockerImage(project.deliveryTomcatImageName)
    }
}

tasks.register('buildDeployer') {
    group = "Build"
    description = "Builds the Deployer Docker image"
    dependsOn prepareAuthoringBundle
	def injected = project.objects.newInstance(InjectedExecOps)
    def imageBuildDir = "${imagesBuildDir}/deployer"

    doFirst {
        delete imageBuildDir
    }
    doLast {
        copy {
            from "${imagesDir}/deployer/"
            into imageBuildDir
        }

        updateDockerfileUser("${imageBuildDir}/Dockerfile")

        copy {
            from "${authoringBundleRoot}/bin/"
            into "${imageBuildDir}/bin"
            exclude "migration"
            exclude "upgrade"
            exclude "cli"
            exclude "mongodb"
            exclude "crafter-cli"
            exclude "apache-tomcat"
            exclude "opensearch"
            exclude "**/*.pid"
        }

		injected.execOps.exec {
            commandLine 'docker', 'buildx', 'build', '--sbom=true', '--provenance=true', '-t', "${project.deployerImageName}:${project.version}", imageBuildDir
        }

        pushTagDockerImage(project.deployerImageName)
    }
}

tasks.register('buildProfile') {
    group = "Build"
    description = "Builds the Profile Docker image"
    dependsOn buildDeliveryTomcat
	def injected = project.objects.newInstance(InjectedExecOps)
    def imageBuildDir = "${imagesBuildDir}/profile"

    doFirst {
        delete imageBuildDir
    }
    doLast {
        copy {
            duplicatesStrategy = 'include'

            from "${imagesBuildDir}/delivery/tomcat/"
            from "${imagesDir}/profile/"
            into imageBuildDir
        }

        updateDockerfileUser("${imageBuildDir}/Dockerfile")

        copy {
            from "${deliveryBundleRoot}/bin/apache-tomcat/webapps/crafter-profile.war"
            from "${deliveryBundleRoot}/bin/apache-tomcat/webapps/crafter-profile-admin.war"
            into "${imageBuildDir}/bin/apache-tomcat/webapps"
        }

		injected.execOps.exec {
            commandLine 'docker', 'buildx', 'build', '--sbom=true', '--provenance=true', '-t', "${project.profileImageName}:${project.version}", imageBuildDir
        }

        pushTagDockerImage(project.profileImageName)
    }
}

