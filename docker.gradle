import org.apache.commons.io.FilenameUtils
import javax.inject.Inject

apply from: "commons.gradle"

buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath "commons-io:commons-io:${project.property('commons-io.version')}"
	}
}

interface InjectedExecOps {
	@Inject
	ExecOperations getExecOps()
}

if (!dockerTag.isEmpty()) {
	project.version = dockerTag
} else if (dockerEnterprise) {
	project.version = project.version.replace("-SNAPSHOT", "E-BETA") // craftercms enterprise version flag
}

// TODO: Use a Docker Gradle plugin to push up if possible
// TODO: See https://plugins.gradle.org/search?term=docker

ext {
	imagesDir = "${cmsDir}/resources/docker/images"
	imagesBuildDir = "${buildDir}/images"
	tempDir = "${buildDir}/temp"

	authoringBuildTarget = 'main'

	if (dockerEnterprise) {
		downloadsRootFolder = "ent/${project.version}"
		authoringBuildTarget = 'enterprise'
	}

	if (!dockerAuthoringBundle.isEmpty()) {
		authoringBundleSource = ""
		if (dockerAuthoringBundle ==~ /^https?:\/\/.+$/) {
			authoringBundleUrl = dockerAuthoringBundle
			authoringBundleFile = "${tempDir}/" + FilenameUtils.getName(authoringBundleUrl)
			authoringBundleRoot = "${tempDir}/" + FilenameUtils.getBaseName(authoringBundleUrl) + "/crafter"
		} else {
			authoringBundleUrl = ""
			authoringBundleFile = dockerAuthoringBundle
			authoringBundleRoot = "${tempDir}/" + FilenameUtils.getBaseName(authoringBundleFile) + "/crafter"
		}
	} else {
		// Authoring bundle
		authoringBundleUrl = ""
		authoringBundleSource = "${bundlesDir}/crafter-cms-authoring-${project.version}-linux-x86_64.tar.gz"
		authoringBundleFile = "${tempDir}/" + FilenameUtils.getName(authoringBundleSource)
		authoringBundleRoot = "${tempDir}/" + FilenameUtils.getBaseName(authoringBundleSource) + "/crafter"
	}

	if (!dockerDeliveryBundle.isEmpty()) {
		deliveryBundleSource = ""
		if (dockerDeliveryBundle ==~ /^https?:\/\/.+$/) {
			deliveryBundleUrl = dockerDeliveryBundle
			deliveryBundleFile = "${tempDir}/" + FilenameUtils.getName(deliveryBundleUrl)
			deliveryBundleRoot = "${tempDir}/" + FilenameUtils.getBaseName(deliveryBundleUrl) + "/crafter"
		} else {
			deliveryBundleUrl = ""
			deliveryBundleFile = dockerDeliveryBundle
			deliveryBundleRoot = "${tempDir}/" + FilenameUtils.getBaseName(deliveryBundleFile) + "/crafter"
		}
	} else {
		// Delivery bundle
		deliveryBundleUrl = ""
		deliveryBundleSource = "${bundlesDir}/crafter-cms-delivery-${project.version}-linux-x86_64.tar.gz"
		deliveryBundleFile = "${tempDir}/" + FilenameUtils.getName(deliveryBundleSource)
		deliveryBundleRoot = "${tempDir}/" + FilenameUtils.getBaseName(deliveryBundleSource) + "/crafter"
	}

	defaultTomcatBinExcludes = [
		"migration",
		"upgrade",
		"crafter-deployer",
		"opensearch",
		"dbms",
		"cli",
		"mongodb",
		"crafter-cli",
		"apache-tomcat/work/**",
		"apache-tomcat/temp/**",
		"apache-tomcat/webapps/crafter-search*",
		"apache-tomcat/webapps/crafter-social*",
		"apache-tomcat/webapps/crafter-profile*",
		"apache-tomcat/webapps/ROOT",
		"apache-tomcat/webapps/studio",
		"**/*.pid"
	]

	defaultTomcatLocalBinExcludes = [
		"migration",
		"upgrade",
		"mongodb",
		"apache-tomcat/work/**",
		"apache-tomcat/temp/**",
		"apache-tomcat/webapps/crafter-search*",
		"apache-tomcat/webapps/crafter-social*",
		"apache-tomcat/webapps/crafter-profile*",
		"apache-tomcat/webapps/ROOT",
		"apache-tomcat/webapps/studio",
		"**/*.pid"
	]
}

ext.pushTagDockerImage = { dockerImage ->
	def injected = project.objects.newInstance(InjectedExecOps)
	if (pushDockerImages) {
		injected.execOps.exec {
			commandLine 'docker', 'push', dockerImage + ":${project.version}"
		}
	}

	if (!tagDockerImages.isEmpty()) {
		injected.execOps.exec {
			commandLine 'docker', 'image', 'tag', dockerImage + ":${project.version}", dockerImage + ":" + tagDockerImages
		}
		injected.execOps.exec {
			commandLine 'docker', 'push', dockerImage + ":" + tagDockerImages
		}
	}
}

ext.updateDockerfileUser = { dockerFile ->
	if (rootlessDockerImages) {
		File dockerfile = file(dockerFile)
		String dockerfileContent = dockerfile.text
		dockerfileContent = dockerfileContent.replaceAll('USER root\n', 'USER crafter\n')
		dockerfile.write(dockerfileContent)
	}
}

task downloadAuthoringBundle(type: Download) {
	src authoringBundleUrl
	overwrite false
	dest authoringBundleFile
}

task downloadDeliveryBundle(type: Download) {
	src deliveryBundleUrl
	overwrite false
	dest deliveryBundleFile
}

task expandAuthoringBundle(type: Copy) {
	if (authoringBundleSource) {
		dependsOn = ["bundle"]
		from tarTree(authoringBundleSource)
		into "${tempDir}/" + FilenameUtils.getBaseName(authoringBundleFile)
	} else {
		mustRunAfter downloadAuthoringBundle
		from tarTree(authoringBundleFile)
		into "${tempDir}/" + FilenameUtils.getBaseName(authoringBundleFile)
	}
}

task expandDeliveryBundle(type: Copy) {
	if (deliveryBundleSource) {
		dependsOn = ["bundle"]
		from tarTree(deliveryBundleSource)
		into "${tempDir}/" + FilenameUtils.getBaseName(deliveryBundleFile)
	} else {
		mustRunAfter downloadDeliveryBundle
		from tarTree(deliveryBundleFile)
		into "${tempDir}/" + FilenameUtils.getBaseName(deliveryBundleFile)
	}
}

task prepareAuthoringBundle() {
	if (authoringBundleUrl) {
		dependsOn downloadAuthoringBundle
	}

	if (authoringBundleSource || authoringBundleUrl || file(authoringBundleFile).file) {
		dependsOn expandAuthoringBundle
	} else {
		doLast {
			copy {
				from "${authoringBundleFile}/"
				into authoringBundleRoot
			}
		}
	}
}

task prepareDeliveryBundle() {
	if (deliveryBundleUrl) {
		dependsOn downloadDeliveryBundle
	}

	if (deliveryBundleSource || deliveryBundleUrl || file(deliveryBundleFile).file) {
		dependsOn expandDeliveryBundle
	} else {
		doLast {
			copy {
				from "${deliveryBundleFile}/"
				into deliveryBundleRoot
			}
		}
	}
}

task copyAuthoringCustomWebapps() {
	dependsOn prepareAuthoringBundle

	if (project.hasProperty("authoringCustomWebapps")) {
		doLast {
			project.property('authoringCustomWebapps').split(',').each { war ->
				copy {
					from war
					into "${authoringBundleRoot}/bin/apache-tomcat/webapps"
				}
			}
		}
	}
}

task copyDeliveryCustomWebapps() {
	dependsOn prepareDeliveryBundle

	if (project.hasProperty("deliveryCustomWebapps")) {
		doLast {
			project.property('deliveryCustomWebapps').split(',').each { war ->
				copy {
					from war
					into "${deliveryBundleRoot}/bin/apache-tomcat/webapps"
				}
			}
		}
	}
}

tasks.register('buildAuthoringTomcat') {
	group = "Build"
	description = "Builds the Authoring Tomcat Docker image"
	dependsOn prepareAuthoringBundle
	dependsOn copyAuthoringCustomWebapps
	def injected = project.objects.newInstance(InjectedExecOps)
	def imageBuildDir = "${imagesBuildDir}/authoring/tomcat"

	doFirst {
		delete imageBuildDir
	}
	doLast {
		copy {
			from "${imagesDir}/authoring/tomcat/"
			into imageBuildDir
		}

		updateDockerfileUser("${imageBuildDir}/Dockerfile")

		copy {
			from "${authoringBundleRoot}/bin/"
			into "${imageBuildDir}/bin"
			exclude defaultTomcatBinExcludes
		}

		injected.execOps.exec {
			commandLine 'docker', 'buildx', 'build', '--sbom=true', '--provenance=true', '--target', authoringBuildTarget, '-t', "${project.authoringTomcatImageName}:${project.version}", imageBuildDir
		}

		pushTagDockerImage(project.authoringTomcatImageName)
	}
}

