tasks.register('buildMainImages') {
    group = 'Build'
    description = 'Builds main Docker images'
    dependsOn buildLogrotate
    dependsOn buildAuthoringTomcat
    dependsOn buildAuthoringLocal
    dependsOn buildDeliveryTomcat
    dependsOn buildDeployer
    dependsOn buildGitSshServer
    dependsOn buildGitHttpsServer
    if (dockerEnterprise) {
        if (project.hasProperty('imagemagick')) {
            dependsOn buildAuthoringTomcatWithImageMagick
        }
    }
}

tasks.register('buildAllImages') {
    group = 'Build'
    description = 'Builds all Docker images'
    dependsOn buildMainImages
    dependsOn buildProfile
}

tasks.register('deleteDockerArtifacts') {
    group = 'Build'
    description = 'Deletes Docker build artifacts'
    doLast {
        execCommand(['docker', 'container', "prune", '-f'], "${projectDir}")
        execCommand(['docker', 'image', 'prune', '-af'], "${projectDir}")
        execCommand(['docker', 'volume', 'prune', '-af'], "${projectDir}")
    }
}
