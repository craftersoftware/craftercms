# # ALB Ingress
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: authoring-ingress
#   annotations:
#     alb.ingress.kubernetes.io/target-type: ip
#     alb.ingress.kubernetes.io/scheme: internet-facing
#     alb.ingress.kubernetes.io/healthcheck-port: '8080'
#     alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
#     alb.ingress.kubernetes.io/healthcheck-path: /studio/api/2/monitoring/status.json?token=defaultManagementToken
#     alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
#     alb.ingress.kubernetes.io/success-codes: '200'
#     alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
# spec:
#   ingressClassName: alb
#   rules:
#     - http:
#         paths:
#           - path: /*
#             pathType: ImplementationSpecific
#             backend:
#               service:
#                 name: authoring-svc-headless
#                 port:
#                   number: 8080
# ---
# # ALB Ingress for the Git HTTPS Server (for internal use only)
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: authoring-git-https-ingress
#   annotations:
#     alb.ingress.kubernetes.io/target-type: ip
#     alb.ingress.kubernetes.io/scheme: internal
#     alb.ingress.kubernetes.io/healthcheck-port: '8080'
#     alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
#     alb.ingress.kubernetes.io/healthcheck-path: /studio/api/2/monitoring/status.json?token=defaultManagementToken
#     alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
#     alb.ingress.kubernetes.io/backend-protocol: HTTPS
#     alb.ingress.kubernetes.io/success-codes: '200'
#     alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
#     # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
#     # alb.ingress.kubernetes.io/ssl-redirect: '443'
#     # alb.ingress.kubernetes.io/certificate-arn: ''
# spec:
#   ingressClassName: alb
#   rules:
#     - http:
#         paths:
#           - path: /studio/api/2/monitoring/status.json
#             pathType: Exact
#             backend:
#               service:
#                 name: authoring-svc-headless
#                 port:
#                   number: 8080
#           - path: /*
#             pathType: ImplementationSpecific
#             backend:
#               service:
#                 name: authoring-svc-headless
#                 port:
#                   number: 443
# ---
# Authoring Headless service
apiVersion: v1
kind: Service
metadata:
  name: authoring-svc-headless
  labels:
    hazelcastClusterName: studio_hazelcast_cluster
spec:
  clusterIP: None
  selector:
    component: authoring
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: git-https
      protocol: TCP
      port: 443
      targetPort: 443
    - name: db-default
      protocol: TCP
      port: 3306
      targetPort: 3306
    - name: hazelcast
      protocol: TCP
      port: 5701
      targetPort: 5701
---
# Authoring Deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authoring
spec:
  serviceName: authoring-svc-headless
  replicas: 2
  updateStrategy:
    type: OnDelete
  podManagementPolicy: "Parallel"
  selector:
    matchLabels:
      component: authoring
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
  template:
    metadata:
      labels:
        component: authoring
    spec:
      volumes:
        - name: git-https-server-cert-files
          secret:
            secretName: git-https-server-cert-files
        - name: crafter-license
          secret:
            secretName: crafter-license
        - name: studio-config
          configMap:
            name: studio-config
        - name: logs
          emptyDir: {}
        - name: temp
          emptyDir: {}
        - name: mnt
          emptyDir: {}
      initContainers:
        # Modifies the crafter-setenv.sh to use the pod ordinal index + offset for the CRAFTER_DB_CLUSTER_SERVER_ID instead of an autogenerated number based on the IP
        - name: crafter-setenv-fixer
          image: craftercms/authoring_tomcat:5.0.0E-SNAPSHOT
          volumeMounts:
            - name: mnt
              mountPath: /mnt
          command: ["bash", "-c"]
          args: ["sed 's/$BIN/$((100 + ${HOSTNAME##*-}))/' /opt/crafter/bin/crafter-setenv.sh > /mnt/crafter-setenv.sh"]
      containers:
        # OpenSearch container
        - name: opensearch
          image: opensearchproject/opensearch:2.19.1
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow
              port: 9200
            initialDelaySeconds: 15
            periodSeconds: 10
          ports:
            - containerPort: 9200
          volumeMounts:
            - name: data
              subPath: indexes
              mountPath: /usr/share/opensearch/data
            - name: logs
              subPath: search
              mountPath: /usr/share/opensearch/logs
          env:
            - name: discovery.type
              value: single-node
            # For example purposes, disables SSL and authentication
            - name: DISABLE_SECURITY_PLUGIN
              value: 'true'
            - name: OPENSEARCH_JAVA_OPTS
              value: "-server -Xss1024K -XX:MaxRAMPercentage=70.0"
          resources:
            requests:
              cpu: 500m
              memory: 2.5Gi
            limits:
              cpu: 1
              memory: 2.5Gi
        # Tomcat container
        - name: tomcat
          image: craftercms/authoring_tomcat:5.0.0E-SNAPSHOT
          startupProbe:
            httpGet:
              path: /api/1/monitoring/status.json
              port: 8080
              httpHeaders:
                - name: X-Crafter-Management-Token
                  value: defaultManagementToken
            failureThreshold: 30
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /api/1/monitoring/status.json
              port: 8080
              httpHeaders:
                - name: X-Crafter-Management-Token
                  value: defaultManagementToken
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/1/monitoring/status.json
              port: 8080
              httpHeaders:
                - name: X-Crafter-Management-Token
                  value: defaultManagementToken
            failureThreshold: 10
            timeoutSeconds: 60
            periodSeconds: 60
          ports:
            - name: http
              protocol: TCP
              containerPort: 8080
            - name: db-default
              protocol: TCP
              containerPort: 3306
            - name: hazelcast
              protocol: TCP
              containerPort: 5701
          volumeMounts:
            - name: git-https-server-cert-files
              subPath: server.crt
              mountPath: /opt/crafter/trusted-certs/git-https-server.crt
              readOnly: true
            - name: mnt
              subPath: crafter-setenv.sh
              mountPath: /opt/crafter/bin/crafter-setenv.sh
              readOnly: true
            - name: crafter-license
              subPath: crafter.lic
              mountPath: /opt/crafter/bin/apache-tomcat/shared/classes/crafter/license/crafter.lic
              readOnly: true
            - name: data
              mountPath: /opt/crafter/data
            - name: temp
              mountPath: /opt/crafter/temp
            - name: logs
              mountPath: /opt/crafter/logs
            - name: studio-config
              subPath: studio-config-override.yaml
              mountPath: /opt/crafter/bin/apache-tomcat/shared/classes/crafter/studio/extension/studio-config-override.yaml
              readOnly: true
            - name: studio-config
              subPath: hazelcast-config.yaml
              mountPath: /opt/crafter/bin/apache-tomcat/shared/classes/crafter/studio/extension/hazelcast-config.yaml
              readOnly: true
          env:
            - name: CATALINA_OPTS
              # The extra params (starting with -add-modules) are recommended by Hazelcast for performance
              value: "-server -Xss1024K -XX:MaxRAMPercentage=70.0 --add-modules java.se --add-exports java.base/jdk.internal.ref=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.management/sun.management=ALL-UNNAMED --add-opens jdk.management/com.sun.management.internal=ALL-UNNAMED"
            - name: SPRING_PROFILES_ACTIVE
              value: "crafter.studio.dbClusterPrimaryReplica"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER_NODE_ADDRESS
              value: "$(POD_NAME).authoring-svc-headless.craftercms"
            - name: MARIADB_CLUSTER_NODE_ADDRESS
              value: "$(CLUSTER_NODE_ADDRESS)"
            - name: MARIADB_CLUSTER_NODE_COUNT
              # This should match the replica count
              value: "2"
            - name: CLUSTER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: git-https-server-credentials
                  key: username
            - name: CLUSTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: git-https-server-credentials
                  key: password
          resources:
            requests:
              cpu: 1
              memory: 5Gi
            limits:
              cpu: 2
              memory: 5Gi
        # Deployer container
        - name: deployer
          image: craftercms/deployer:5.0.0E-SNAPSHOT
          imagePullPolicy: "Always"
          startupProbe:
            httpGet:
              path: /api/1/monitoring/status
              port: 9191
              httpHeaders:
                - name: X-Crafter-Management-Token
                  value: defaultManagementToken
            failureThreshold: 60
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /api/1/monitoring/status
              port: 9191
              httpHeaders:
                - name: X-Crafter-Management-Token
                  value: defaultManagementToken
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/1/monitoring/status
              port: 9191
              httpHeaders:
                - name: X-Crafter-Management-Token
                  value: defaultManagementToken
            failureThreshold: 10
            timeoutSeconds: 60
            periodSeconds: 60
          ports:
            - containerPort: 9191
          volumeMounts:
            - name: data
              mountPath: /opt/crafter/data
            - name: temp
              mountPath: /opt/crafter/temp
            - name: logs
              mountPath: /opt/crafter/logs
          env:
            - name: DEPLOYER_JAVA_OPTS
              value: "-server -Xss1024K -Xmx2G -XX:MaxRAMPercentage=70.0"
          resources:
            requests:
              cpu: 1
              memory: 2.5Gi
            limits:
              cpu: 2
              memory: 2.5Gi
        # Git HTTPS server container
        - name: git-https-server
          image: craftercms/git_https_server:5.0.0E-SNAPSHOT
          imagePullPolicy: "Always"
          ports:
            - containerPort: 443
          volumeMounts:
            - name: git-https-server-cert-files
              subPath: server.crt
              mountPath: /usr/local/apache2/conf/server.crt
              readOnly: true
            - name: git-https-server-cert-files
              subPath: server.key
              mountPath: /usr/local/apache2/conf/server.key
              readOnly: true
            - name: data
              mountPath: /opt/crafter/data
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: git-https-server-credentials
                  key: username
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: git-https-server-credentials
                  key: password
