version: "~> 1.0"
git:
    depth: 1
    quiet: true
language: java
jdk:
    - openjdk21
cache:
    directories:
        - "$HOME/.m2"
branches:
    only:
        - develop
        - support/4.1
notifications:
    slack: craftersoftware:7YiSb41ZG5rfMgiAY7Qgprc7
install: skip
script:
    - if [[ "$TRAVIS_PULL_REQUEST" == "false" ]]; then
        bash -c "mvn -DskipTests -f shared-dependencies/pom.xml deploy --settings .travis-settings.xml";
        bash -c "mvn -DskipTests -f pom.xml deploy --settings .travis-settings.xml";
        bash -c "mvn -DskipTests -f spring-boot/pom.xml deploy --settings .travis-settings.xml";
        fi
    - if [[ "$TRAVIS_PULL_REQUEST" != "false" ]]; then
        bash -c "mvn -DskipTests -f shared-dependencies/pom.xml deploy --settings .travis-settings.xml";
        bash -c "mvn -DskipTests -f pom.xml clean install --settings .travis-settings.xml";
        bash -c "mvn -DskipTests -f spring-boot/pom.xml clean install --settings .travis-settings.xml";
        fi
env:
    global:
        -   secure: ""
        -   secure: ""
