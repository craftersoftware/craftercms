version: '2.4'
target:
  env: {{env}}
  siteName: {{site_name}}
  {{#if source_target}}
  sourceSiteName: {{source_target.siteName}}
  {{/if}}
  localRepoPath: {{repo_url}}
  search:
    indexIdFormat: '%s-authoring'
  deployment:
    scheduling:
       enabled: false
    pipeline:
      - processorName: gitDiffProcessor
        includeGitLog: true
      - processorName: authoringSearchIndexingProcessor
        excludeFiles: ['^/sources/.*$', '^/\.crafter/.*$']
        reindexDependentItemsOnDescriptorUpdates: false
      - processorName: httpMethodCallProcessor
        includeFiles: [ "^/?config/studio/scripts/classes/.*$" ]
        method: GET
        url: ${target.studioUrl}/api/2/plugin/${target.siteName}/script/reload.json?token=${target.studioManagementToken}
      - processorName: fileOutputProcessor
