      security: []
      tags:
        - target
      summary: Delete a Crafter Deployer target.
      description: "Module: Deployer"
      operationId: deleteTarget
      parameters:
        - name: env
          in: path
          description: The target’s environment (e.g. dev).
          required: true
          schema:
            type: string
          example:
            env: dev
        - name: site_name
          in: path
          description: The target’s project/site name (e.g. editorial).
          required: true
          schema:
            type: string
          example:
            site_name: editorial
      responses:
        '204':
          description: NO CONTENT
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/1/target/delete-if-exists/{env}/{site_name}:
