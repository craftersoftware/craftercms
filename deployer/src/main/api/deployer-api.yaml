            application/json:
              schema:
                type: object
                properties:
                  MemoryInfo:
                    type: object
                    properties:
                      totalJvmMemory:
                        type: string
                      freeJvmMemory:
                        type: string
                      maxJvmMemory:
                        type: string
                      totalOsMemory:
                        type: string
                      freeOsMemory:
                        type: string
                      totalSwapMemory:
                        type: string
                      freeSwapMemory:
                        type: string
                    example:
                      totalJvmMemory: 154140672
                      freeJvmMemory: 102165520
                      maxJvmMemory: 1073741824
                      totalOsMemory: 34359738368
                      freeOsMemory: 59957248
                      totalSwapMemory: 8589934592
                      freeSwapMemory: 1076363264
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Targets:
      type: object
      properties:
        env:
          type: string
        siteName:
          type: string
        id:
          type: string
        load_date:
          type: string
        status:
          type: string

    Deployment:
      type: object
      properties:
        mode:
          type: string
        status:
          type: string
        running:
          type: boolean
        duration:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        target:
          $ref: '#/components/schemas/Targets'
        changeSet:
          $ref: '#/components/schemas/ChangeSet'
        processorExecutions:
          type: array
          items:
            type: string

    ChangeSet:
      type: object
      properties:
        created_files:
          type: array
          items:
            type: string
        updated_files:
          type: array
          items:
            type: string
        deleted_files:
          type: array
          items:
            type: string

    DuplicateTargetRequest:
      allOf:
        - $ref: '#/components/schemas/CreateTargetRequest'
        - type: object
          properties:
            source:
              allOf:
                - $ref: '#/components/schemas/CreateTargetRequest'

    CreateTargetRequest:
      type: object
      properties:
        env:
          type: string
          description: "The target’s environment (e.g. dev)."
        site_name:
          type: string
          description: "The target’s project/site name (e.g. my-editorial)."
        replace:
          type: boolean
          description: "Replace the existing target."
        template_name:
          type: string
          description: "The template to use for configuration generation. Out-of-the-box remote and local are provided. If not specified, remote will be used."
        disable_deploy_cron:
          type: boolean
          description: "Disables the cron job that runs deployments every certain amount of time."
        repo_url:
          type: string
          description: "Depends on the template. If <i>remote</i> is being used, it specifies the URL of the remote repo to pull from (e.g. ssh://…). If instead the template is <i>local</i>, <i>repo_url</i> is the filesystem path of the local repo (e.g. /opt/..)."
        repo_branch:
          type: string
          description: "Only use with <i>remote</i> template. The branch name of the remote Git repo to pull from. If not specified, the branch will be whatever branch is the current one in the remote repo."
        repo_username:
          type: string
          description: "Only use with <i>remote</i> template. The username of the remote Git repo."
        repo_password:
          type: string
          description: "Only use with <i>remote</i> template. The password of the remote Git repo."
        ssh_private_key_path:
          type: string
          description: "Only use with <i>remote</i> template. The path for the private key used for the remote Git repo."
        ssh_private_key_passphrase:
          type: string
          description: "Only use with <i>remote</i> template. The passphrase for the private key for the remote Git repo (only if the key is passphrase-protected)."
        engine_url:
          type: string
          description: "Base URL of Engine, used to make API calls like clear cache and rebuild context. If not specified, the default is http://localhost:8080."
        notification_addresses:
          type: string
          description: "The email addresses that should receive deployment notifications."
      required:
        - env
        - site_name
        - repo_url


  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Target not found
    Created:
      description: CREATED
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
            example:
              message: "OK"

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Required request parameter 'token' for method parameter type String is not present

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid management token
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Target already exists
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Internal Server Error
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Not available

    Accepted:
      description: Accepted
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: OK
