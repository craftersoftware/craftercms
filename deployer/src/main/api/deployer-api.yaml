openapi: 3.0.0
servers:
  - url: 'http://localhost:9191'
info:
  description: |-
    Crafter Deployer API
  version: '4.5.2'
  title: Crafter Deployer
  termsOfService: ''
  contact:
    email: info@craftercms.org
  license:
    name: GPL 3.0
    url: 'https://www.gnu.org/licenses/gpl-3.0.en.html'
externalDocs:
  description: CrafterCMS - Deployer
  url: 'https://craftercms.com/docs/current/reference/modules/deployer.html'
tags:
  - name: target
    description: Target management  operations
  - name: monitoring
    description: Monitoring operations

paths:

  /api/1/target/create:
    post:
      security: []
      tags:
        - target
      summary: Create a Crafter Deployer target
      description: |
              Module: Deployer <br>
              Target creation is based on templates. The deployer comes with two out of the box: remote and local. The remote template creates targets that pull changes from a remote Git repository, making it ideal to create targets for delivery environments. The local template instead generates targets that use a local Git repo and the last processed commit to infer the changes, without executing a pull, so it’s used mostly to create targets for authoring environments. <br><br> If a target already exists and <b><i>replace</i></b> is true, then the new target will replace the existing one. If <b><i>replace</i></b> is false and the target exists, a 409 is returned.
      operationId: createTarget
      requestBody:
        description: Create target request body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTargetRequest'
            examples:
              simpleExample:
                summary: Simple example of the request body
                description: "Module: Deployer"
                value:
                  env: preview
                  site_name: my-editorial
                  replace: true
                  disable_deploy_cron: true
                  template_name: local
                  repo_url: /opt/crafter/data/repos/sites/my-editorial/sandbox
                  engine_url: http://localhost:8080
              withNotificationAddresses:
                summary: Example of request body with notification addresses
                description: "Module: Deployer"
                value:
                  env: dev
                  site_name: my-editorial
                  replace: false
                  template_name: remote
                  repo_url: ssh://crafter@server/opt/crafter/data/repos/sites/my-editorial/published
                  repo_username: crafter
                  repo_password: crafter
                  repo_branch: live
                  engine_url: http://localhost:8080
                  notification_addresses: "admin1@my-editorial.com, admin2@my-editorial.com"
              withGitPullOptions:
                summary: Example of request body with git pull options
                description: "Module: Deployer"
                value:
                  env: dev
                  site_name: my-editorial
                  replace: false
                  template_name: remote
                  repo_url: ssh://crafter@server/opt/crafter/data/repos/sites/my-editorial/published
                  repo_username: crafter
                  repo_password: crafter
                  repo_branch: live
                  engine_url: http://localhost:8080
                  fast_forward_mode: "FF"
                  merge_strategy: "recursive"
                  content_merge_option: "THEIRS"
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/1/target/get/{env}/{site_name}:
    get:
      security: []
      tags:
        - target
      summary: Get a Crafter Deployer target.
      description: "Module: Deployer"
      operationId: getTarget
      parameters:
        - name: env
          in: path
          description: The target’s environment (e.g. dev).
          required: true
          schema:
            type: string
          example:
            env: dev
        - name: site_name
          in: path
          description: The target’s project/site name (e.g. editorial).
          required: true
          schema:
            type: string
          example:
            site_name: editorial
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Targets'
              example:
                env: dev
                siteName: editorial
                id: editorial-dev
                load_date: 2023-01-26T10:00:01.234-05:00
                status: INIT_COMPLETED
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/1/target/get-all:
    get:
      security: []
      tags:
        - target
      summary: Get all Crafter Deployer targets.
      description: "Module: Deployer"
      operationId: getAllTargets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Targets'
              example:
                - load_date: 2023-03-30T13:24:36.042181-04:00
                  env: preview
                  siteName: hi
                  status: INIT_COMPLETED
                  id: hi-preview
                - load_date: 2023-03-31T09:48:48.214383-04:00
                  env: preview
                  siteName: third
                  status: INIT_COMPLETED
                  id: third-preview
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/1/target/delete/{env}/{site_name}:
