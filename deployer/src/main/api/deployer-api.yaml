      summary: Delete a Crafter Deployer target if it exists.
      description: "Module: Deployer"
      operationId: deleteTargetIfExists
      parameters:
        - name: env
          in: path
          description: The target’s environment (e.g. dev).
          required: true
          schema:
            type: string
          example:
            env: dev
        - name: site_name
          in: path
          description: The target’s project/site name (e.g. editorial).
          required: true
          schema:
            type: string
          example:
            site_name: editorial
      responses:
        '204':
          description: NO CONTENT
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/1/target/deploy/{env}/{site_name}:
    post:
      security: []
      tags:
        - target
      summary: Deploy a Crafter Deployer target.
      description: "Module: Deployer"
      operationId: deployTarget
      parameters:
        - name: env
          in: path
          description: The target’s environment (e.g. dev).
          required: true
          schema:
            type: string
          example:
            env: dev
        - name: site_name
          in: path
          description: The target’s project/site name (e.g. editorial).
          required: true
          schema:
            type: string
          example:
            site_name: editorial
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reprocess_all_files:
                  description: If all files in all the target repos should be reprocessed.
                  type: boolean
                from_commit_id:
                  description: The id of the commit to start processing changes<br><br> <i>Available since version 4.0.0</i>
                  type: string
                deployment_mode:
                  description: "The deployment mode to execute. Possible values: <br> &nbsp;&nbsp;&nbsp;<b>PUBLISH</b>: All processors will run<br> &nbsp;&nbsp;&nbsp;<b>SEARCH_INDEX</b>: Only the indexing processor will run <br><br> <i>Available since version 4.0.0</i>"
                  type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OK
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/1/target/deploy-all:
    post:
      security: []
      tags:
        - target
      summary: Deploy all Crafter Deployer targets.
      description: "Module: Deployer"
      operationId: deployAllTargets
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reprocess_all_files:
                  description: If all files in all the target repos should be reprocessed.
                  type: boolean
                deployment_mode:
                  description: "The deployment mode to execute. Possible values: <br> &nbsp;&nbsp;&nbsp;<b>PUBLISH</b>: All processors will run<br> &nbsp;&nbsp;&nbsp;<b>SEARCH_INDEX</b>: Only the indexing processor will run <br><br> <i>Available since version 4.0.0</i>"
                  type: string
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

