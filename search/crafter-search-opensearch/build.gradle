plugins {
	id 'java-library'
}

apply from: "${rootDir}/gradle/java-library.gradle"

base {
	archivesName = 'crafter-search-opensearch'
}

dependencies {
	implementation project(':search:batch-indexer')
	implementation project(':search:commons')
	implementation project(':core')
	implementation project(':commons:utilities')

	implementation libs.opensearch.rest.high.level.client
	implementation libs.opensearch.java
	implementation libs.tika.core
	implementation libs.tika.parsers.standard.package
	implementation libs.poi.scratchpad
	implementation libs.jdom2
	implementation libs.bcmail.jdk18on
	implementation libs.metadata.extractor
	implementation libs.commons.compress
	implementation libs.protobuf.java
	implementation libs.unit.api
	implementation libs.jackson.dataformat.xml
	implementation libs.stax2.api
	implementation libs.commons.io
	implementation libs.commons.lang3
	implementation libs.commons.collections4
	implementation libs.slf4j.api
	implementation libs.spring.core
	implementation libs.spring.beans
	implementation libs.dom4j

	testImplementation libs.opensearch.runner
	testImplementation libs.spring.test
	testImplementation libs.junit
	testImplementation libs.mockito.core
	testImplementation libs.hamcrest
	testImplementation libs.json.path
	testImplementation libs.json.path.assert
	testImplementation libs.slf4j.simple
}

tasks.named('test') {
	// Integration tests require embedded OpenSearch; run explicitly when needed.
	exclude '**/*IT.class'
	exclude '**/*ITCase.class'
	exclude '**/*ITTest.class'
}
