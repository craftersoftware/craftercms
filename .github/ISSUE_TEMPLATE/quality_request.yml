name: Quality Issue
description: Report a quality issue
labels: [ "triage" ]
type: Quality
body:
    -   type: checkboxes
        attributes:
            label: Latest version
            description: We roll bug fixes, performance enhancements, and other improvements into new releases.
            options:
                -   label: The issue is in the develop branch
                -   label: The issue is in the latest released version
                -   label: The issue is in an older release (specified in the ticket)

    -   type: markdown
        attributes:
            value: |
                Please provide a searchable summary of the enhancement in the title above.

    -   type: checkboxes
        attributes:
            label: Duplicates
            description: Please [search the history](https://github.com/craftersoftware/craftercms/issues) to see if an issue already exists for the same enhancement request.
            options:
                -   label: I have searched the existing issues
                    required: true

    -   type: textarea
        id: motivation
        attributes:
            label: What's the quality issue/defect? Please describe.
            description: A clear and concise description of what the problem is.
            placeholder: Describe the quality issue
        validations:
            required: true

    -   type: textarea
        id: description
        attributes:
            label: Describe the solution you'd like
            description: A clear and concise description of what you want to happen and any alternatives you've considered.
            placeholder: What should CrafterCMS do?
        validations:
            required: true
