# The store type to use for sites
crafter.engine.store.type=s3
# Indicates if cache warming should be enabled. This means the site cache will be warmed up (according to a list of
# cache warmers) on context init and instead of cache clear, a new cache will be warmed up and switched with the
# current one
crafter.engine.site.cache.warmUp.enabled=true
# Flag that specifies if the thread creating the context should wait till the context is initialized, false if
# initialization should be done in the background
crafter.engine.site.context.waitForInit=true
# Maximum content length (in bytes) for S3 objects to be cached in memory. Larger files will be retrieved
# directly from S3 every time they are requested.
# Default set to 10M = 10 * 1024 * 1024
crafter.engine.store.s3.cache.contentMaxLength=10485760
# Store path of the deployment events file. Engine reads this object directly from S3 so a
# content store manifest that does not list it still reports new publishes.
crafter.engine.store.s3.deploymentEventsFileUrl=deployment-events.properties
# Studio base URL, including the context path (for example http://localhost:8080/studio).
# When set, Engine lists sites from Studio. When empty, Engine lists sites from S3.
crafter.engine.studio.url=
# Management token sent as X-Crafter-Management-Token. Must match Studio's
# studio.configuration.management.authorizationToken (STUDIO_MANAGEMENT_TOKEN).
crafter.engine.studio.managementToken=
# Timeouts in milliseconds for the Studio site list call used when creating and syncing contexts.
crafter.engine.studio.connectTimeout=5000
crafter.engine.studio.readTimeout=10000
# Timeouts in milliseconds for the Studio site list call made by the all-sites health check.
# A slow Studio response falls back to S3 within the probe budget. Context creation and sync
# keep the timeouts above.
crafter.engine.studio.healthCheck.connectTimeout=200
crafter.engine.studio.healthCheck.readTimeout=200
# White list of paths to be cached in memory when using S3 store.
crafter.engine.store.s3.cache.allowedPaths=\
    /config/.*,\
    /site/.*,\
    /scripts/.*,\
    /templates/.*,\
    /static-assets/css/.*,\
    /static-assets/js/.*,\
    /static-assets/fonts/.*,\
    /static-assets/app/.*,\
    /static-assets/seo/.*
