plugins {
	id 'war'
}

ext.crafterManifestTitle = 'Crafter Profile Integration Tests'

apply from: "${rootDir}/gradle/java-library.gradle"
apply from: "${rootDir}/gradle/war.gradle"

base {
	archivesName = 'crafter-profile-integration-tests'
}

dependencies {
	implementation project(':profile:client')

	testImplementation project(':profile:api')
	testImplementation project(':commons:utilities')
	testImplementation project(':commons:security')
	testImplementation libs.spring.context
	testImplementation libs.spring.web
	testImplementation libs.mongo.bson
	testImplementation libs.junit
	testImplementation libs.spring.test
	testImplementation libs.greenmail
	testImplementation libs.slf4j.simple
}

processResources {
	filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
		'mongo.port': findProperty('profileMongoPort') ?: '37017',
		'cargo.port': findProperty('cargoPort') ?: '8080'
	])
}

war {
	dependsOn ':profile:server:war'
	from({
		zipTree(project(':profile:server').tasks.named('war').get().archiveFile.get().asFile)
	}) {
		exclude 'META-INF/MANIFEST.MF'
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('test') {
	// Requires embedded Mongo, Cargo/Jetty; run explicitly when needed.
	enabled = false
}
